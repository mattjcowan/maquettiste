# The documentation site (mkdocs.yml): built on every pull request and push to main that touches it, so a broken link or
# anchor fails there (mkdocs build --strict), and published to GitHub Pages when a version tag is pushed, so the site
# describes the latest release:
#
#   https://mattjcowan.github.io/maquettiste/
#
# Pages must be set to "GitHub Actions" in the repository's settings (Settings, Pages, Source). It can also be run by
# hand from the Actions tab to publish the current main.

name: Docs

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'packs/**/README.md', 'packs/README.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'packs/**/README.md', 'packs/README.md', '.github/workflows/docs.yml']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
