name: bench

# The SPEC section 13 benchmark (engine-design.md section 17): a cold full run over the synthetic model (5,000 entities,
# 20,000 relations, 100,000+ files), an incremental run after one entity edit, and a --check run, compared with the budgets
# and with bench/baseline.json when it is committed (fails on a regression beyond 10%; without it the run emits a warning).
# Exit code 2 = a budget, the regression gate, the check run or the determinism cross-check failed. Owned by W11.
#
# The budgets assume an 8-core machine on native disk; hosted ubuntu-latest runners have fewer cores, so pick a larger or
# self-hosted runner through the dispatch input for numbers that mean something. The baseline is only comparable on the machine
# class that produced it (see bench/README.md): when the cores, --jobs, OS, architecture, GC mode or runtime overrides differ from
# the baseline's, the harness skips the regression gate (the report says why) instead of failing, and this workflow warns.
#
# CI baseline (bench/README.md): the dispatch input record-ci-baseline runs the bench on the runner with --advisory-budgets and
# uploads its report as the bench-baseline-ci artifact (baseline-ci.json); commit it as bench/baseline-ci.json. When that file is
# committed, every run compares against it with the 10% regression gate and --advisory-budgets, and the step is binding. Without
# it the older run applies: bench/baseline.json (a developer machine's), absolute budgets, advisory on the shared runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
      jobs:
        description: "--jobs (engine parallelism cap)"
        required: false
        default: "8"
      max-regression:
        description: "Allowed regression against the baseline, in percent"
        required: false
        default: "10"
      record-ci-baseline:
        description: "Record bench/baseline-ci.json on this runner (uploaded as the bench-baseline-ci artifact; commit it to enable the gate)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: benchmark
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore maquettiste.slnx --locked-mode

      - name: Build
        run: dotnet build bench/Maquettiste.Bench/Maquettiste.Bench.csproj --configuration Release --no-restore

      - name: Machine
        run: |
          uname -a
          nproc
          (lscpu || sysctl -a | grep machdep.cpu) 2>/dev/null | head -20 || true
          free -m 2>/dev/null || true

      # The mode: record the CI baseline (dispatch input), gate against the committed CI baseline (binding), or the older run
      # against bench/baseline.json with the absolute budgets, advisory on a shared runner (warned about below).
      - name: Baseline
        id: baseline
        env:
          RECORD: ${{ inputs.record-ci-baseline && 'true' || 'false' }}
        run: |
          if [ "$RECORD" = true ]; then
            echo "args=--advisory-budgets" >> "$GITHUB_OUTPUT"
            echo "report=bench/results/baseline-ci.json" >> "$GITHUB_OUTPUT"
            echo "binding=true" >> "$GITHUB_OUTPUT"
          elif [ -f bench/baseline-ci.json ]; then
            echo "args=--baseline bench/baseline-ci.json --advisory-budgets" >> "$GITHUB_OUTPUT"
            echo "report=bench/results/report.json" >> "$GITHUB_OUTPUT"
            echo "binding=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning file=bench/baseline-ci.json::No bench/baseline-ci.json is committed: the absolute budgets are advisory on this runner and the 10% regression gate only runs against bench/baseline.json on its own machine class. Run this workflow with record-ci-baseline and commit the artifact to make the gate binding."
            if [ -f bench/baseline.json ]; then echo "args=--baseline bench/baseline.json" >> "$GITHUB_OUTPUT"; else echo "args=" >> "$GITHUB_OUTPUT"; fi
            echo "report=bench/results/report.json" >> "$GITHUB_OUTPUT"
            echo "binding=false" >> "$GITHUB_OUTPUT"
          fi

      # Gate 1 and both baselines are recorded with --no-example-packs (bench/README.md): the example packs add the sql-ddl schema
      # unit, one 9 MB file for the 10,005-table database, which alone costs about 3 s of the incremental run.
      - name: Benchmark
        continue-on-error: ${{ steps.baseline.outputs.binding != 'true' }}
        run: >
          dotnet run --project bench/Maquettiste.Bench --configuration Release --no-build --
          --jobs ${{ inputs.jobs || '8' }}
          --no-example-packs
          ${{ steps.baseline.outputs.args }}
          --max-regression ${{ inputs.max-regression || '10' }}
          --out "${{ runner.temp }}/maquettiste-bench"
          --report ${{ steps.baseline.outputs.report }}

      - name: Regression gate
        if: always()
        run: |
          report="${{ steps.baseline.outputs.report }}"
          if [ -f "$report" ] && grep -q '"regressionGateSkipped"' "$report"; then
            reason=$(sed -n 's/.*"regressionGateSkipped": "\(.*\)",\{0,1\}$/\1/p' "$report")
            echo "::warning::Regression gate skipped: ${reason}"
          fi

      - name: Upload the CI baseline
        if: always() && inputs.record-ci-baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-ci
          path: bench/results/baseline-ci.json
          if-no-files-found: error

      - name: Upload report
        if: always() && !inputs.record-ci-baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench/results/report.json
          if-no-files-found: ignore
