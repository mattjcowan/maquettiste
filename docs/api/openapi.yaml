      operationId: reportPresence
      summary: Report this window's selection
      description: Stores the selection of one realtime connection that belongs to the caller and publishes `presence.changed` to `editors`. Idempotent; the editor sends it when the selection or workspace changes (debounced 250 ms) and after every reconnect.
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (functions state and IRealtime)
