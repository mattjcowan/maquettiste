  /api/model/elements:
    post:
      tags: [model]
      operationId: createElement
      summary: Create an element
      description: |
        The body is a model document of any kind. A missing top-level `id` is assigned by the engine; sub-element ids
        (attributes, relation ends, keys, columns) must be present, so the editor generates them (uppercase ULIDs). The
        engine writes the canonical file in the kind's conventional folder.
      x-maquettiste-role: editor
      x-maquettiste-engine: ModelStore.CreateAsync(json, ChangeSource.Editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModelDocument'
            examples:
              entity:
                summary: A new entity with two attributes
                value:
                  kind: entity
                  name: Refund
                  package: 01J92P0V01KDRN8GX5PGYCNKSX
                  key:
                    attributes:
                    - 01M3P0000000000000000000A1
                  attributes:
                  - id: 01M3P0000000000000000000A1
                    name: id
                    type: uuid
                    required: true
                  - id: 01M3P0000000000000000000A2
                    name: amount
                    type: decimal
                    precision: 12
                    scale: 2
                    required: true
      responses:
        '201':
          description: Created. `current` is the new document.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: /api/model/elements/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResult'
              examples:
                created:
                  summary: The entity was written
                  value:
                    outcome: saved
                    id: 01M3MNY0GJQHEAHZ3C98GZZ3Q3
                    hash: 90df3d3dc5d29b121aff75d34dfd3abc4706049ad84a583ee9d09abafd6e2bcc
