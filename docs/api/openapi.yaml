  /api/processes/import:
    post:
      tags: [processes]
      operationId: importProcess
      summary: Preview or apply an XState machine config import
      description: |
        phase-3-design.md sections 5.1 and 5.2. `?dryRun=true` (the default) returns the process document the import gives with its
        diagnostics (MQ9401 to MQ9406) and the ids it creates, writing nothing. `into` re-imports over an existing process (id or
        name), keeping the ids of the nodes it matches; `removed` lists what it drops. With `dryRun=false` the document is saved as
        one change: 409 when `into` changed since `expectedHash`, 422 when the import has errors or the process does not validate.
      x-maquettiste-role: editor
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xstate]
            default: xstate
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessImportRequest'
            example:
              config:
                id: Door
                initial: Closed
                states:
                  Closed:
                    on:
                      open: Opened
                  Opened:
                    on:
                      close: Closed
              package: purchasing
              use: orchestration
      responses:
        '200':
          description: The preview, or the saved import (`applied` true, `hash`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
              example:
                document:
                  kind: process
                  id: 01JQPRC0000000000000000099
                  name: Door
                  states: []
                diagnostics: []
                created: [01JQPRC0000000000000000099]
                removed: []
                applied: false
                id: 01JQPRC0000000000000000099
                hash: null
        '409':
          description: '`into` changed since `expectedHash`; nothing was written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The import has errors, or the process does not validate; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/sync-enum:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: syncEnumFromProcess
      summary: Sync a lifecycle's bound enum with its root-level states
      description: |
        phase-3-design.md sections 3 and 4.4, the `sync-enum` batch operation. The bound enum's members become the root-level states in
        document order (ids, codes and descriptions kept). `dryRun: true` returns the plan. A member still used by a default,
        `allowedValues`, a seed cell or a scenario value is listed in `refused` and not removed: there is no force flag, change the uses
        first (applying such a plan is 422 with MQ9019). 409 when the process changed since `expectedHash`.
      x-maquettiste-role: editor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncEnumRequest'
            example:
              dryRun: true
      responses:
        '200':
          description: The plan, applied unless `dryRun`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
              example:
                process: 01JQPRC0000000000000000001
                enum: 01JQENM0000000000000000001
                added: [OnHold]
                removed: []
                reordered: false
                refused: []
                applied: false
                diagnostics: []
        '409':
          description: The process changed since `expectedHash`; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The process is not a bound lifecycle, or a removal is refused (MQ9019 in `diagnostics`); nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

