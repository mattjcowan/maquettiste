  /api/processes/{id}/sync-codes:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: syncCodesFromRows
      summary: Propose state codes from a bound attribute's type, and bind it
      description: |
        lifecycle-design.md decision 19, the `sync-codes` batch operation. `entity` and `attribute` name the subject and the attribute
        that holds its state (an enum, a reference type or a plain status). The states that need a code are those a binding maps: a
        state with no code and no coded state below it, walking down from the root while a state has coded descendants (history and
        choice states never). Each keeps the code it has; else it takes the one code of the attribute's type equal to its name (case,
        `_` and `-` ignored: a reference type's live codes, an enum member's key, value or name, a plain status's `allowedValues`),
        else the one reference row or enum member whose label (display name) equals its display name or name. An ambiguous match, or
        a code another state keeps or takes, takes none and is listed in
        `unmatched` with its candidates; `stateCodes` (state id to code) gives the rest, or replaces a code. It writes the codes and the
        binding in the form the file has (a process with no subject gets `subjects`; on the one-subject form, `entity` must be its
        subject) and creates no rows. `dryRun: true` returns the plan. 409 when the process changed since `expectedHash`; 422 with
        MQ9019 when the operation is refused, or with the findings that refuse the save (for example MQ9207 for a code that does not
        fit the attribute).
      x-maquettiste-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCodesRequest'
            example:
              entity: 01JQENT0000000000000000001
              attribute: 01JQATT0000000000000000002
              dryRun: true
      responses:
        '200':
          description: The plan, applied unless `dryRun`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCodesResult'
              example:
                process: 01JQPRC0000000000000000001
                entity: 01JQENT0000000000000000001
                attribute: 01JQATT0000000000000000002
                binds: true
                codes:
                  - state: 01JQSTA0000000000000000001
                    path: Draft
                    code: DRF
                    source: name
                unmatched:
                  - state: 01JQSTA0000000000000000002
                    path: Review
                    candidates: []
                applied: false
                diagnostics: []
        '409':
          description: The process changed since `expectedHash`; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCodesResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The operation is refused (MQ9019 in `diagnostics`), or the save would add an error; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCodesResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/plan:
    post:
      tags: [generation]
      operationId: startPlan
      summary: Start a dry run as a job
      description: |
        Queues a plan job and returns it at once. Join the realtime group `job:{id}` for `job.progress` and
        `job.completed`, then read `GET /api/jobs/{id}` once, so an event sent before the join is not missed. The
        functions force `includeDiffs: false`, `stageBarriers: false` and `lock: wait`; `mode` is ignored (a plan is
        always a dry run). `against` diffs the schema from a model snapshot for this plan instead of the committed
        physical snapshots, which its apply leaves alone; the functions take snapshot ids only, so a folder, or an id
        that names no snapshot, is 400 `bad-request`. `units` and `elements` limit the plan to some units (scoped
        generation): it holds those units only, and its apply writes their files and leaves every other file alone.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: JobQueue.TryEnqueue(new JobRequest(JobKind.Plan, request, null))
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequest'
            example:
              packs: [sql-ddl]
      responses:
        '202':
          description: Queued.
          headers:
            Location:
