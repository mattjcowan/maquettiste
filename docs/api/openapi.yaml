                        rules: {}
                      limits:
                        scriptTimeoutMs: 2000
                        scriptStatements: 5000000
                        scriptRecursion: 256
                        scriptMemoryBytes: 67108864
                        templateLoopLimit: 1000000
                        templateRecursionLimit: 64
                    settingsHash: 695f8e249265560b146d7b54f3a083a26131a540fc392959840b46a62f7ae82c
                    databases:
                    - id: 01J92P0V1QRN2181XM2ZWE02W4
                      kind: database
                      name: main
                      package: null
                      tags: []
                      category: null
                      stereotypes: []
                      hash: 7fccf6c4f0985534e9089ca5b34664883add3de727699fb83d825ae1d0a638f5
                      path: .maquettiste/model/databases/main/database.json
                    packs:
                    - $schema: null
                      name: sql-ddl
                      version: 1.0.0
                      engine: '>=1.0 <2.0'
                      description: 'SQL DDL for PostgreSQL, SQL Server and SQLite: one script per table, one schema script per database, once-mode migrations from the schema diff and a seed script with protected regions.'
                      parameters:
