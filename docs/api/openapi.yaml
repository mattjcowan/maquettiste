  /api/model/resolved:
    get:
      tags: [model]
      operationId: getResolvedModel
      summary: The resolved model as flat records, in pages
      description: |
        What templates read (the resolved model of SPEC Section 10), as data for external systems. Resolved objects reference each
        other, so they are projected into flat records (`x-engine-record`) where other objects appear by id; each record has `id`,
        `kind` and `name`. Choose what to read with `scope`, which follows the template scopes (`get_template_context`):

        - `entities`: `EntityRecord`, each attribute resolved (`type` with the enum, value object, scalar or reference type it
          names, `default`, `length`, `precision`, `scale`, `isKey`; the base entity's attributes come first, marked `isInherited`),
          the key, alternate keys, `base` and `derived`, navigations, `relations`, one mapping per database (table key and the
          column of each attribute path) and the annotations.
        - `relations`, `enums`, `value-objects`, `scalar-types`, `packages`, `reference-types` (with every row), `seeds`, `actors`,
          `scenarios`: the matching record.
        - `processes`: `ProcessRecord`, every state at every depth with `parent` and `children`, the transitions, events, guards
          (a guard written in the expression language with its `condition`), actions, gates and invokes, actors by id.
        - `operations`: `OperationRecord`, the subject, level and effect, the input members, the outcomes (`isDefault`,
          `completes`, `returns`), the errors (`code`, `input`), `fires` and `requires` by id, and the `guards` in the order
          they are checked, each with its `condition` and the `error` it reports.
        - `custom-elements`: `CustomRecord`, one custom element per record with its `type`, `package`, `content` as written and
          its `members` (`MemberRecord`: `id`, `name`, `array`, `parent`, `pointer`), every member at any depth in walk order.
        - `constraints`: `ConstraintRecord`, one named constraint per record with its typed `parameters`, its `condition` and its
          `message`. An entity's `checks`, a derived attribute's `value` and a process or operation guard's `condition` are
          written in the same expression language: each `ExpressionRecord` has the `text` printed from current names, its `type`,
          whether it is `nullable` and the `tree` of ids the file holds; a model without expressions has none of these keys.
        - `databases`: `DatabaseRecord`, the database view of `getDatabaseView` (tables with columns, keys, foreign keys and
          indexes, views, sequences, routines, database types, SQL objects and queries); `tables`: one `TableRecord` per table,
          for databases too large for one record; `routines`, `database-types`, `sql-objects`, `queries`: one `RoutineRecord`,
          `DatabaseTypeRecord`, `SqlObjectRecord` or `QueryRecord` per object.
        - `migrations`: `MigrationRecord`, one open migration fact per record, by database name then applied order, with its
          state, the intent it lacks, its `after` links, object, current key, `from`, `to` and content hash.
        - `all` (the default): every scope but `tables`, `routines`, `database-types`, `sql-objects` and `queries`, which
          `databases` holds.

        `database` narrows entities and relations to the ones mapped (not ignored) in that database, and databases, tables and
        migration facts to it; the other kinds are not narrowed. Records come ordered by kind, name and id (ordinal); pass `next` as `cursor` until it
        is null. The model is validated and resolved once per model version, so paging through it costs one resolution; a change
        between pages is tolerated (the next page starts after the last record read, in the changed model). A model with errors
        returns no records and the errors in `diagnostics`, unless its only errors are migration facts that wait for their intent
        (MQ4101): those still return records. The MCP tool `get_resolved_model` and `maquettiste model export --resolved` answer
        the same.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetResolvedAsync(query)
      parameters:
        - $ref: '#/components/parameters/SnapshotQuery'
        - name: scope
          in: query
          description: What to read.
          schema:
            type: string
            enum: [all, packages, entities, relations, enums, value-objects, scalar-types, reference-types, seeds, processes, actors, scenarios, operations, custom-elements, constraints, databases, tables, routines, database-types, sql-objects, queries, migrations]
            default: all
        - name: database
          in: query
          description: A database id; only what is mapped to it.
          schema:
            $ref: '#/components/schemas/Ulid'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of records, or the errors that prevented resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPage'
              examples:
                enums:
                  summary: GET /api/model/resolved?scope=enums on the billing fixture
                  value:
                    items:
                      - id: 01J92P0V05WQDH2GZG539D9VG1
