    BatchOp:
      type: string
      description: >-
        `upsert` (`id` a qualified name, `element`, optional `expectedHash`) is a `create` when the model as loaded has no
        element of that name and an `update` of the whole document when it has one, with the file's hash unless `expectedHash`
        gives one. It never writes a seed. `id` must be one of the names the element will have, an update keeps the longest of
        them, and a document may not replace an existing part with one that has no id; each refusal is MQ1012 to MQ1015 at
        `/operations/<n>/id`.
        `translate` (reference-types-seeds-localization.md section 3.9) is declared; until its handler lands a batch that holds one
        is refused with MQ1002 at `/operations/<n>/op`. The schema operations (erratum E26) act on database `id`: `add-schema`
        (`name`, optional `schema` id), `rename-schema` (`schema`, `name`; the default follows the rename), `remove-schema`
        (`schema`; refused with MQ4015 listing what lives there unless `target` names the schema it moves to, and refused for the
        default unless `default` names the new default) and `set-default-schema` (`schema`). Each expands into updates of the
        database and of the tables, views, sequences and mappings it moves; `items` then holds the other operations' results
        followed by one per element the schema operations changed. The process operations (phase-3-design.md sections 3 and
        4.4): `sync-enum` (`id` a lifecycle process, optional `entity` the subject whose enum binding it syncs, or `stereotype`
        the key of a stereotype entry, else the lifecycle's one enum binding; its bound enum's members become the bound states in document order,
        keeping the ids, codes and descriptions of kept members; refused with MQ9019 when a removed member is still used by a
        default, allowed values, a seed cell or a scenario value, or when another operation of the batch writes the process or
        the enum), `sync-codes` (lifecycle-design.md decision 19: `id` a lifecycle process, `entity` a subject or `stereotype` the
        key of a stereotype the lifecycle lists, `attribute` the subject's attribute that holds the state (on a stereotype, one of
        its own), optional `stateCodes` keyed by state id; it gives each state a binding maps a
        code, keeping the codes states have, matching the attribute type's codes by name and rows by label, and binds the
        attribute in the form the file has; see `POST /api/processes/{id}/sync-codes` for the matching and the plan. Refused with
        MQ9019 when `id` is not a lifecycle, `entity` is not its one-subject form's subject or follows it only through a
        stereotype entry, `stereotype` is not listed, `attribute` is not an attribute that can hold a state, a `stateCodes` key is not a state that rests, or another operation of the batch writes the
        process), `set-lifecycle` (`id` an entity, `target` a
        process: it becomes the entity's named lifecycle (lifecycle-design.md decision 9). A target in the one-subject form, or
        with no subject, takes the entity as its one subject (a target with no subject gets `subjects` with one entry) and the
        entity's previous lifecycle in the one-subject form becomes an orchestration, as before; a target that uses `subjects`
        gains an entry for the entity when it has none, the entity's previous lifecycle in the one-subject form still becomes an
        orchestration, and its other lifecycles that use `subjects` are left alone. Without `target` it clears the entity's
        lifecycle: its lifecycles in the one-subject form become orchestrations, the entity leaves the `subjects` of the others,
        and one left with no subject becomes an orchestration; an orchestration keeps its subjects and loses its bindings),
        `set-initial` (`id` a process or a compound
        state, `target` one of its direct children), `refresh-scenario` (`id` a scenario: every step's `expect` and the
        `outcome` are rewritten from a replay in the engine interpreter; refused when the replay cannot reach the last step,
        or when another operation of the batch writes the scenario or its process) and `use-subjects` (lifecycle-design.md
        decision 6: each process `elementIds` lists, or without it every process, that is in the one-subject form is rewritten
        with a `subjects` list of one entry, with a new id, holding its `subject` and `boundAttribute`; a listed process
        already using `subjects`, or with no subject, is left as it is, and nothing to convert writes nothing). They expand into updates the same way, and a refusal is MQ9019 at
        `/operations/<n>`. The materialize operations (erratum E43) act on `database`: `materialize-tables` (`entities`, optional
        `schema`: a designed table per entity with the shape its projection has and a binding of the entity to it; the overlay
        folds into the table, the entity's mapping to the database is deleted, relation mappings name the foreign keys, and the
        committed schema snapshot records the stored tables' keys as aliases, which the schema diff reads it through, so neither the
        materialize nor its undo is a drop and a create; optional `expectedHashes`: the hash the caller read of each element the
        preview lists as changed or deleted, any other or changed one a conflict) and `materialize-entities` (`tables`, `package`: an entity per designed or imported
        table or view, bound to it, and a many-to-one relation per foreign key between them) and `materialize-attributes`
        (`entities`, each bound to the database, and for one entity optional `columns`, keys or physical names of its source's
        columns: an attribute per column, named camel-case and typed from the column, mapped to it in the binding; without
        `columns`, every column nothing in the binding names: unaccounted, identity or with a default; an ignored listing of a
        column it maps goes) and `materialize-columns` (`entities`, each bound to the database and reading a designed or imported
        table it writes, and for one entity optional `attributes`, binding field references: a column of that table per attribute
        the binding leaves unmapped, with the shape the entity's projection gives it, mapped to it; a column whose name the table has
        is left out with a note, no foreign key is written); they expand the same way, and a refusal (an entity or table already
        bound, or for attributes an entity with no binding to the database, a query source, a column already mapped or nothing left
        to add, or for columns a source that is not a table file, an attribute already mapped or that no column holds) is MQ4055 at
        `/operations/<n>`. `retag` (2026-10-07) removes `tags`, or renames the one tag to `name`, in the tag vocabulary of `package` (the global one without it) and in every element and sub-element whose use of it that vocabulary governs (see `GET /api/model/tags/usage`); it expands into updates the same way, takes the materialize operations' optional `expectedHashes`, and a refusal (nothing uses or declares the tags, a rename of several tags or to a key that is not a tag) is MQ1002 at `/operations/<n>`.
        `tags-to-property` (next-phase-1-design.md section 4.4) moves the tags that start with `prefix` into the custom property
        `name` of each element and sub-element with properties that holds them, in the scope `retag` would change, limited to
        `elementIds`: the schema that declares the property converts the suffixes (a string takes one, a string array all of them
        in list order, an integer, number or boolean one parsed with the invariant culture, an `enum` one member, an `x-ref` the
        one id the suffix finds as `names-to-ids` resolves it); the tags leave their holders and, without `elementIds`, their
        declarations leave the vocabulary, except a tag that something without properties (a relation end, for example) still
        uses, whose declaration stays. It expands the same way and takes `expectedHashes`; no matching tag is MQ1002 at
        `/operations/<n>`, and each holder whose property no schema declares, whose suffix does not fit or that already holds
        another value is one MQ5001 at its file and `/properties/<name>`. `names-to-ids` (section 4.1) turns every custom property
        value an `x-ref` types that is a name, not an id, into the one id it finds among the in-scope candidates of the keyword's
        kinds (elements by their qualified-name forms, stereotypes by key; within `of` sub-elements by name, columns by physical
        name, rows by code), in the elements `elementIds` lists or in every document with `x-ref` sites, stereotype defaults
        included. It expands the same way and takes `expectedHashes`; each value that finds nothing or several is one MQ2010 at
        its file and pointer, and nothing to convert writes nothing. `fold-into-stereotype` (next-phase-2-design.md section 3.1)
        makes the stereotype `id`'s members replace the matching own members of `tables`, or of every designed and imported table
        of `schema`; `redefine` and `excludeMissing` keep the database unchanged where a member differs or is missing, and a
        refusal is MQ4077. The binding operations (next-phase-2-design.md section 3.3) act on `database` and `entities`, read files
        only and never resolve the model: `map-by-name` maps every attribute a binding leaves unmapped to a free column of its
        source with the same loose name (case and every character that is not an ASCII letter or digit ignored; a member as
        `attributeMember`, a to-one navigation key with or without `Id`), fields naming a table file's columns by id and a view's
        by name; `resync-binding` brings a binding whose source is a table file into step with the table: it renames an own
        attribute that followed its column's name (unless `keepNames`), retypes an own attribute whose column was retyped, maps
        by name, adds an attribute per added column still free and removes the fields of removed columns, keeping every
        attribute; for one entity, `columns` (keys or physical names) limits it to those columns. Both record the binding's
        `provenance` (each column's name and type hashes) for a table file, expand the same way, take `expectedHashes`, and a
        refusal (an entity with no binding to the database, a source they cannot read, `columns` misused, nothing to map, or
        every binding named in step) is MQ4089 at `/operations/<n>`. The reference-type refactors (next-phase-2-design.md
        section 3.5) read the model as it was before the batch and find every use through the index: `rename-code` (`id` a
        reference type, `code`, `to`) gives the row the new code and rewrites every default, `allowedValues` entry, seed cell,
        typed column default, table seed cell, binding constant and state code under a lifecycle's binding (lifecycle-design.md
        decision 18) that named the old one; `retire-code` (`id`, `code`, `to`
        another live code) removes the code's row with its translations, rewrites its uses to `to` and the ids that named the row
        (`x-ref` values, former codes) to the row of `to`; `merge-reference-types` (`id` the type merged away, `target` the type
        merged into, optional `codes`) maps each code the target holds to it, `codes` maps others to live target codes, moves every
        other row into the target with its id, values and translations, retargets the seeds (one with the name of a target seed
        joins it), points every reference to the type at the target and deletes it; `rename-reference-type` (`id`, `name`) renames
        the type, its file and its seed folder following. Each keeps the old code as a former code of the type and answers
        `usage` on the item of the type it names (the merged-away type's delete for a merge). They expand the same way, take
        `expectedHashes`, refactor a type once per batch, and a refusal (an unknown or scripted code, a code taken or former, a
        code that does not fit, mismatched code types, a binding or scripted rows on the merged type, a field the target lacks,
        seeds of one name that differ in environments or apply, a second refactor of a type) is MQ7020 at `/operations/<n>`.
        When the batch's refactors are planned, a state code they rewrite must be a live code of every other reference type its
        lifecycle binds that held the old code, so a code two bound types share is renamed in both in one batch; and no
        lifecycle may be left with two states of one code. Either is MQ7020 at the operation that rewrote the code.
        The verb operations (verbs-design.md decision 9) act on the project's own verb whose key is `verb`: `rename-verb` (`verb`,
        `to`) gives it the key `to` and rewrites every event, transition and operation that names it, all or nothing; when `to` is
        another own verb's key or a built-in verb's, the two merge: the uses move to it and the definition goes with its
        translations, and `to` equal to `verb` when a built-in verb has that key adopts the built-in. `remove-verb` (`verb`) removes
        the own verb with its translations and clears `verb` from every use. Both take `expectedHashes` and `dryRun`, expand into
        updates, and a refusal (a key no own verb has, a malformed `to`, `to` equal to `verb` with no built-in of that key) is
        MQ1002 at `/operations/<n>`.
      enum: [create, update, delete, translate, add-schema, rename-schema, remove-schema, set-default-schema, materialize-tables, materialize-entities, materialize-attributes, materialize-columns, sync-enum, sync-codes, set-lifecycle, set-initial, refresh-scenario, use-subjects, retag, tags-to-property, names-to-ids, fold-into-stereotype, map-by-name, resync-binding, rename-code, retire-code, merge-reference-types, rename-reference-type, rename-verb, remove-verb, upsert]
    BatchOperation:
      x-engine-record: Maquettiste.Engine.BatchOperation
      description: |
        One batch operation. Every id field (`id`, `database`, `package`, `schema`, `target`, `default`, the items of
        `entities`, `tables` and `elementIds`, an `attributes` item that starts with `@` or `$`, the keys of
        `expectedHashes`) and every reference inside `element` takes an id, a qualified name (`@kind:path`, the name as
        stored: `@table:billing.notes`) or a placeholder (`$name`, declared with `as`); the engine resolves them to ids before
        the batch is planned and mints every missing id (next-phase-1-design.md section 5.1). A name that finds nothing is
        MQ1012, several MQ1013; a misused identity is MQ1014 and a malformed or misplaced name MQ1015.
      type: object
      required: [op, id, expectedHash, element]
      properties:
        op:
          $ref: '#/components/schemas/BatchOp'
        id:
          description: >-
            An id, a qualified name or a placeholder. A create's `id` must be an id; an update's or delete's names an element
            that exists before the batch, never a placeholder; an upsert's must be a qualified name. For a reference-type refactor, the reference type (for
            `merge-reference-types`, the one merged away).
          type: [string, 'null']
        as:
          description: >-
            Create, update and upsert: the placeholder (`$name`) that names the operation's element for the whole batch, so other
            operations write it where the element's id goes. An object inside `element` whose schema requires an `id` may carry
            `as` too, naming that sub-element.
          type: [string, 'null']
        expectedHash:
          type: [string, 'null']
        element:
          type: [object, 'null']
          additionalProperties: true
        locale:
          description: The locale of a translation (`translate`).
          type: [string, 'null']
        field:
          description: The translated field (`translate`).
          oneOf:
            - type: string
              enum: [displayName, pluralName, label, description]
            - type: 'null'
        value:
          description: 'The translated text, `{ "file": "<sidecar>" }`, or `null` to remove the translation (`translate`).'
        schema:
          description: The database schema (`rename-schema`, `remove-schema`, `set-default-schema`; optional for `add-schema`) as an id, a qualified name or a placeholder.
          type: [string, 'null']
        name:
          description: The schema name (`add-schema`, `rename-schema`); the new tag key (`retag`); the custom property the tags move to (`tags-to-property`); the reference type's new name (`rename-reference-type`).
          type: [string, 'null']
        code:
          description: The code a refactor renames (`rename-code`) or retires (`retire-code`), as the code's canonical text (an integer in decimal digits, a uuid in lowercase).
          type: [string, 'null']
        verb:
          description: The key of the project's own verb a verb operation acts on (`rename-verb`, `remove-verb`).
          type: [string, 'null']
        to:
          description: The new code (`rename-code`); the live code whose row takes over the retired code's uses (`retire-code`); the verb's new key (`rename-verb`), another own verb's or a built-in verb's to merge into it.
          type: [string, 'null']
        codes:
          description: '`merge-reference-types`: codes of the merged-away type mapped to live codes of the target, for codes the target does not hold itself; every other code moves into the target as a row.'
          type: [object, 'null']
          additionalProperties:
            type: string
        entity:
          description: >-
            The subject whose binding the operation acts on. `sync-enum`: the subject whose bound enum is synced; absent means the
            lifecycle's one enum binding, in either subject form. `sync-codes`: the subject whose attribute holds the state; on a
            lifecycle in the one-subject form it must be that subject, on one that lists subjects an entity not listed gets an
            entry, and a lifecycle with no subject gets `subjects` with one entry. An id, a qualified name or a placeholder, except
            for `sync-codes`, which reads the model as it was before the batch: there it must name an existing entity (an id or a
            qualified name, not a placeholder).
          type: [string, 'null']
        stereotype:
          description: >-
            `sync-enum` and `sync-codes`, in place of `entity` (stereotype-sets-design.md decision 10): the key of the stereotype whose
            `subjects` entry the operation acts on. `sync-enum` syncs the enum that entry binds; `sync-codes` binds one of the
            stereotype's own attributes in that entry, which the lifecycle must already list.
          type: [string, 'null']
        attribute:
          description: >-
            `sync-codes`: the attribute of `entity` (own, inherited or from a stereotype), or of `stereotype` (its own), that holds the state, single-valued and
            typed by an enum, a reference type or a plain status (`string`, `text`, `int16`, `int32` or `int64`, directly or
            through a scalar type); the operation binds it in the form the file has. It must name an existing attribute (an id or a
            qualified name, not a placeholder): `sync-codes` reads the model as it was before the batch.
          type: [string, 'null']
        stateCodes:
          description: >-
            `sync-codes`: codes keyed by state id (or a state's qualified name), each a string or an integer; a listed state takes
            its code, replacing one it has. Every other state that needs a code keeps its own or is matched (see
            `POST /api/processes/{id}/sync-codes`). The operation creates no rows.
          type: [object, 'null']
          additionalProperties:
            type: [string, integer]
        target:
          description: The schema that what lives in the removed schema moves to (`remove-schema`); the process (`set-lifecycle`); the child state (`set-initial`); the reference type merged into (`merge-reference-types`). An id, a qualified name or a placeholder.
          type: [string, 'null']
        default:
          description: The schema that becomes the default when the removed schema is the default (`remove-schema`). An id, a qualified name or a placeholder.
          type: [string, 'null']
        database:
          description: The database (`materialize-tables`, `materialize-entities`, `materialize-attributes`, `materialize-columns`, `map-by-name`, `resync-binding`). An id, a qualified name or a placeholder.
          type: [string, 'null']
        entities:
          description: The entities (`materialize-tables`, `materialize-attributes`, `materialize-columns`, `map-by-name`, `resync-binding`), each an id, a qualified name or a placeholder.
          type: [array, 'null']
          items:
            type: string
        tables:
          description: The tables and views (`materialize-entities`), each an id, a qualified name or a placeholder.
          type: [array, 'null']
          items:
            type: string
        package:
          description: The package the new entities go to (`materialize-entities`); the domain whose tag vocabulary it is (`retag`, `tags-to-property`; absent for the global one). An id, a qualified name or a placeholder.
          type: [string, 'null']
        columns:
          description: The source columns, as keys or physical names (`materialize-attributes` and `resync-binding`, one entity); absent means every column nothing in the binding names (`materialize-attributes`) or every column of the source (`resync-binding`).
          type: [array, 'null']
          items:
            type: string
        attributes:
          description: The binding field references, attribute ids among them (`materialize-columns`, one entity); absent means every attribute the binding leaves unmapped. An item that starts with `@` or `$` is one attribute or end by name or placeholder; the composite `attributeId.memberId` stays ids.
          type: [array, 'null']
          items:
            type: string
        tags:
          description: The tag keys (`retag`).
          type: [array, 'null']
          items:
            type: string
        elementIds:
          description: >-
            The elements `names-to-ids`, `tags-to-property` and `use-subjects` act on, each an id, a qualified name or a
            placeholder; absent means every element they apply to.
          type: [array, 'null']
          items:
            type: string
        prefix:
          description: The prefix of the tags that move into the property `name` (`tags-to-property`).
          type: [string, 'null']
        redefine:
          description: '`fold-into-stereotype`: write a `redefines` entry with the table''s value where an own member differs from the stereotype''s in a redefinable facet, instead of refusing the table.'
          type: [boolean, 'null']
        excludeMissing:
          description: '`fold-into-stereotype`: exclude each member of the stereotype a table lacks, instead of refusing the table.'
          type: [boolean, 'null']
        keepNames:
          description: '`resync-binding`: keep every attribute''s name, even one that followed its column''s name; the provenance entry still takes the column''s new name.'
          type: [boolean, 'null']
        expectedHashes:
          description: |
            Materialize, `map-by-name`, `resync-binding`, `fold-into-stereotype`, `retag`, `tags-to-property`, `names-to-ids`, the reference-type refactors, `rename-verb` and `remove-verb`: the hash the caller read of each element it expects the operation to change or delete (the preview's
            updates and deletes). Given, an element that changed since, or that the operation changes but the map does not name, is
            a conflict and nothing is written. A key may be an id or a qualified name; a placeholder key is MQ1015, two keys for
            one element are MQ1014.
          type: [object, 'null']
          additionalProperties:
            type: string
    ModelBatch:
      x-engine-record: Maquettiste.Engine.ModelBatch
      type: object
      required: [operations]
      properties:
        operations:
          type: array
