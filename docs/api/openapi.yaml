            (values OR, and AND with `elements`). `null` or an empty list: every unit. A unit no run pack has, a pack the
            run lacks or a unit id several run packs have is MQ6032. A scoped run writes only the selected units' files
            (and deletes the files they no longer produce), keeps every other output and unit state, never advances the
            schema snapshots (a selected unit that reads the schema diff is MQ6033) and, as a plan, stores the filters
            that its apply plans again with.
          type: [array, 'null']
          items:
            type: string
          default: null
        elements:
          description: >-
            Scoped generation: only the units of these elements, by id, never by name (a synthesized table's id is
            `<entityId>@<databaseId>`); units that run once for the whole model never match. Values OR, and AND with
            `units`. `null` or an empty list: every element. A filter that selects no unit and no earlier output is the
            warning MQ6034.
          type: [array, 'null']
          items:
            type: string
          default: null
