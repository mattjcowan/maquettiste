                        columnCase: null
                        tableName: null
                        keyColumn: null
                        foreignKeyColumn: null
                        junctionTable: null
                        childTable: null
                        valueObjectColumn: null
                        orderColumn: null
                        discriminatorColumn: null
                        primaryKeyName: null
                        foreignKeyName: null
                        uniqueName: null
                        indexName: null
                        checkName: null
                        sequenceName: null
                        defaultStringLength: null
                        decimalPrecision: null
                        decimalScale: null
                        datetimePrecision: null
                        enumStorage: null
                        valueObjectStorage: null
                        valueObjectCollectionStorage: null
