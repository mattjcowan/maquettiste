      summary: What a delete would do
      description: |
        The elements a delete with `resolution` would take with it, the references it would clear, the parts it would remove
        from elements that stay and what blocks it, with kinds and names from the index, computed like the delete itself
        (the same planner and validation) without writing anything. `outcome` is what the delete would return now.
      x-maquettiste-role: viewer
      x-maquettiste-engine: ModelStore.GetDeletePlanAsync([id], resolution) (404 when ModelStore.GetElementAsync finds no element with that id)
      parameters:
