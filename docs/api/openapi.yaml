openapi: 3.1.0
info:
  title: Maquettiste editor API
  version: 0.2.0-phase2
  summary: The JSON API the Maquettiste editor's C# functions expose on the editor's own domain (SPEC Section 16), phase 2 subset.
  description: |
    The editor site's `_functions/` answer this API on the editor's domain (`http://maquettiste.localhost:8080` in local
    mode). Every handler is route parsing, the sign-in check and one call into `Maquettiste.Engine`
    (`docs/engineering/engine-design.md` section 15, `docs/engineering/phase2-design.md` section 3). The binding
    design is `docs/engineering/phase2-design.md`; this file is the contract the editor SPA, its generated client and its
    MSW mocks are built from.

    **Serialization.** Every body that mirrors an engine record is that record serialized by `System.Text.Json` with
    `JsonSerializerDefaults.Web` and no custom converters (host-contracts requirement 5): camelCase names, every
    property written, `null` included, enums as the kebab-case strings the engine declares, `TimeSpan` as
    `[-][d.]hh:mm:ss[.fffffff]`, `DateTimeOffset` as ISO 8601 with offset, and non-ASCII and HTML-sensitive characters
    escaped as `\uXXXX` (the default encoder). Computed public properties are serialized too (`ChangeSet.isEmpty`,
    `ValidationReport.hasErrors`). Schemas marked `x-engine-record` name the C# record they mirror; a change to that
    record is a change to this file in the same commit.

    **Model documents.** Request bodies that carry an element, and `ElementDocument.json`, are canonical model files
    as `schemas/v1/<kind>.json` defines them (canonical JSON omits defaults). `ElementDocument.element` is the same
    element as the engine's typed record, with every property present (defaults and `null`s written). The editor edits
    and sends `json`, never `element`.

    **Hashes and ETags.** An element's hash is the lowercase hex SHA-256 of its canonical file bytes (64 characters,
    no prefix). Responses carry it as a strong ETag (`ETag: "<hash>"`); `If-Match` accepts the quoted or bare hash.

    **Authentication.** One middleware (`[Middleware(Order = 0)]`) gates every request to the site, static files
    included. It admits, in order: (1) in local mode (`MAQUETTISTE_MODE=local`, the default) unless
    `MAQUETTISTE_LOCAL_TRUST=off`, a request whose remote address, normalised from its IPv4-mapped form (Kestrel
    listens dual-stack and reports `::ffff:172.17.0.1`), is loopback or one of `MAQUETTISTE_LOCAL_PEERS` (the
    container's gateway, which is how a `127.0.0.1` port binding reaches the container), whose `Host` is
    `localhost`, a `*.localhost` name, `127.0.0.1` or `[::1]`, and which carries no `Forwarded`, `X-Forwarded-For`,
    `X-Forwarded-Host` or `X-Real-IP` header, signed in as the local admin with no credential; (2) `Authorization: Bearer
    <MAQUETTISTE_EDITOR_TOKEN>` (the CLI and scripts); (3) the `mq_session` cookie (`mq_session_<port>` on a host with a port) set by `POST /api/session`. Phase 2
    has one role in use, `admin`; each operation names the least role it will need once accounts land
    (`x-maquettiste-role`). A state-changing request whose `Origin` header is present and is not the site's own origin
    is refused with 403 `forbidden-origin`, and a `POST` or `PUT` body must be `application/json` (cross-site request
    forgery defence for the credential-less local mode).

    **Errors.** Outcomes of engine calls come back as engine records (`SaveResult`, `BatchResult`, `ValidationReport`,
    `PreviewResult`, `JobInfo`) with the status the outcome maps to. Everything else (authentication, routing, bad
    input, a full job queue, an unexpected failure) is an RFC 9457 problem document (`Problem`) with a stable `code`.

    **Realtime.** Long work runs as jobs; progress and model changes arrive over the host's SignalR hub at
    `/_host/realtime` (`site.realtime` from `/_host/site.js` in the browser), not over this API. The event payloads
    are the `Realtime*` schemas under `components.schemas`; `x-maquettiste-realtime` at the root lists each event,
    its group and its schema.

    **Engine additions.** Operations and schemas marked `x-engine-addition` need an engine call that phase 1 does not
    have (E1 to E4 in `phase2-design.md` section 3.8); their shapes are binding for that work.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Maquettiste
    url: https://github.com/mattjcowan/maquettiste
servers:
  - url: http://maquettiste.localhost:8080
    description: Local mode (the compose file of SPEC Section 4)
  - url: /
    description: The editor's own origin (hosted mode, later)
security:
  - sessionCookie: []
  - editorToken: []
tags:
  - name: session
    description: Who the caller is; token sign-in for non-loopback access.
  - name: health
    description: Liveness of the host and readiness of the editor functions.
  - name: project
    description: Project settings, databases, packs and extension schemas.
  - name: model
    description: Elements, the model index, references and atomic batches.
  - name: diagrams
    description: Canvas views (membership, positions, viewport).
  - name: databases
    description: The resolved physical model of a database, for table diagrams and mappings.
  - name: validation
    description: Whole-model or scoped validation.
  - name: generation
    description: Plan, per-file diff and apply, as jobs.
  - name: jobs
    description: The job queue (one running job at a time).
  - name: templates
    description: Render one unit against one element with no writes (DDL preview).
  - name: packs
    description: Read and write template packs in place (generation-ui.md section 5.1).
  - name: extensions
    description: Read and write the model's extensions folder in place, the custom property schemas and the script rules.
  - name: presence
    description: Which element each open editor window has selected.
  - name: localization
    description: Translations of the standard fields per locale and shard, their completeness, and XLIFF 2.1 and CSV exchange files (reference-types-seeds-localization.md section 3).
  - name: reference-data
    description: Seed CSV import and export and reference type usage (reference-types-seeds-localization.md sections 2.3 and 3.9).
  - name: processes
    description: Simulation, scenario recording and verification, XState import and export, and enum sync for processes (phase-3-design.md section 4.4).
  - name: assist
    description: The assistant panel (SPEC Section 14 "Assist", erratum E44) over the host's AI; proposals are applied through the model batch.
  - name: snapshots
    description: Named, immutable copies of the whole model (zip archives under `.maquettiste/model-snapshots/`); list, take, open read-only with `?snapshot=`, compare, restore, export and import (docs/engineering/snapshots.md).
  - name: realtime
    description: Events pushed over the host's SignalR hub (`webhooks`); the browser listens with `site.realtime.on`.
x-maquettiste-realtime:
  hub: /_host/realtime
  browser: site.realtime from /_host/site.js (on, off, join, leave, state, connectionId, onStateChange)
  notes: |
    The browser only listens and joins; the functions publish with IRealtime. Payloads are at most 256 KB of JSON:
    model.changed and validation.completed are cut with ChangeSet.TruncateTo and ValidationReport.TruncateTo to 200 KB
    and carry `truncated: true` when cut, and the editor then refetches (`GET /api/model/index`, `POST /api/validate`).
    job.completed is a fixed-size summary (RealtimeJobCompleted), never the JobInfo, whose stale lists and diagnostics
    can exceed the limit; the editor reads `GET /api/jobs/{id}` for the record.
    [RealtimeConnect] admits the same callers as the middleware and returns their user name; [RealtimeJoin] admits a
    signed-in connection to `editors` and to `job:{id}` for any job id (a ULID).
  events: See `webhooks`. Each realtime event is described there as a webhook so client generators emit its payload type; nothing is POSTed, the hub delivers it.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHostHealth
      summary: Host liveness (answered by static-site-hosting itself)
      description: Answered by the host on any host name before any site or function runs, so it says only that the process is up. Compose health checks and the CLI's "is the editor up" check use it. The release running is in `GET /api/health` (`productVersion`, `build`).
      security: []
      x-maquettiste-handler: host
      responses:
        '200':
          description: The host is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
              example:
                status: ok

  /api/health:
    get:
      tags: [health]
      operationId: getEditorHealth
      summary: Editor readiness
      description: Whether the editor functions are loaded, the model is indexed and the background services run, and which release answers (`productVersion`, `build`). Admitted without credentials.
      security: []
      x-maquettiste-role: anonymous
      x-maquettiste-engine: ModelStore.Current; background service state kept by the functions
      responses:
        '200':
          description: Ready or starting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorHealth'
              example:
                status: ok
                productVersion: 0.5.3
                build: 0.5.3-b14a8131cfe39
                engineVersion: 1.0.0
                engineBuild: 0.5.3-b14a8131cfe39
                modelLoaded: true
                elements: 26
                worker: running
                watcher: watching

  /api/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Who the caller is
      x-maquettiste-role: viewer
      responses:
        '200':
          description: Signed in (loopback, token or cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              example:
                user:
                  name: local
                  displayName: Local developer
                  role: admin
                via: local
                mode: local
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [session]
      operationId: signIn
      summary: Sign in with the editor token
      description: |
        Phase 2 sign-in for a non-loopback browser: the caller presents `MAQUETTISTE_EDITOR_TOKEN` once and receives the
        host-only, `HttpOnly`, `SameSite=Strict` cookie `mq_session` (`mq_session_<port>` when the `Host` header names a
        port: browsers share a host's cookies across its ports, so two editors on one host keep a session each), protected
        with the host's data-protection keys and bound to a fingerprint of the token, so rotating the token ends every session. The middleware's own sign-in page
        posts the same field as a form. Passwords and invite links arrive with accounts (phase 4).
      security: []
      x-maquettiste-role: anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in; the cookie is set.
          headers:
            Set-Cookie:
              description: '`mq_session=<protected>; Path=/; HttpOnly; SameSite=Strict` (plus `Secure` behind TLS); `mq_session_<port>` on a host with a port.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '303':
          description: Form post signed in; redirects to `/` (or the `returnUrl` field when it is a local path).
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [session]
      operationId: signOut
      summary: Sign out
      x-maquettiste-role: viewer
      responses:
        '204':
          description: The cookie is cleared. A loopback caller in local mode stays signed in.
        '401':
          $ref: '#/components/responses/Unauthenticated'

