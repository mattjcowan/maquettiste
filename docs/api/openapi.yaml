      description: Where the job is in its life, not whether the run did what was asked. `succeeded` means the run completed and produced a result, whatever its outcome (`JobQueue` maps only the `cancelled` and `failed` run outcomes to other states), so a `stale`, `invalid`, `conflicts`, `drift` or `busy` run is `succeeded` too. The run's result is `planResult.outcome` or `applyResult.outcome`.
