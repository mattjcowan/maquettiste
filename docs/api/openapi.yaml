  /api/templates/preview:
    post:
      tags: [templates]
      operationId: previewTemplate
      summary: Render one unit against one element, with no writes
      description: |
        The Database workspace's DDL preview calls `sql-ddl`/`table` with a resolved table key (`<entityId>@<databaseId>`
        for a synthesized entity table, a table file's id for a designed one) and `sql-ddl`/`schema` with a database id.
        The unit renders even when its `where` filter would not plan it. A model with errors returns the errors and no
        files. An element outside the unit's scope (another kind than its `each`, one its selector does not return, an
        element for a `model` unit, or none for an element unit) returns MQ6026 and no files, before anything renders
        (pointer `/units/<i>/for` of the pack's `pack.json`).
        With `unitOverride`, `overlay` or `parameters` the unit renders with unsaved text (generation-ui.md section 5.2): the
        pack loads even when disabled, the sandbox limits apply and the render has a deadline of 4 x `limits.scriptTimeoutMs`,
        or 8000 ms when it is 0 (MQ6007 when it is hit). Unsaved text is code the server runs, so such a request needs the
        maintainer role (403 below it). Nothing is written.

        Bounds (generation-ui.md section 5.2): only this unit is rendered, for this element, and no unit is planned. The
        server keeps a preview session per pack (the model validated and resolved once per model version, shared with
        validation; the pack; schema diffs computed per database on first read), reused until the model, the settings, the
        pack's files or the committed schema snapshots change. A unit whose one render covers the whole model (`for: model`),
        a database or a locale renders all of it, so the editor sends it only when the user asks.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.PreviewAsync(pack, unit, elementId, options)
      parameters:
      - $ref: '#/components/parameters/SnapshotQuery'
      - name: X-Maquettiste-Client
        in: header
        required: false
        description: |
          The caller's live-preview key (any opaque string, e.g. per editor tab). A newer request of this kind with the same
          value cancels one still in flight on the server (409 `superseded`); without it nothing is superseded.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
            example:
              pack: sql-ddl
              unit: table
              elementId: 01J92P0V0ETQKXXP951CMMNHH3@01J92P0V1QRN2181XM2ZWE02W4
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The rendered files and diagnostics.
          content:
