      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
              examples:
                billing:
                  summary: The billing fixture
                  value:
                    name: billing
                    formatVersion: 1
                    engineVersion: 1.0.0
                    mode: local
                    settings:
                      $schema: .schema/v1/maquettiste.json
                      formatVersion: 1
                      name: billing
                      outputs:
                        allow:
                        - path: db
                          commit: true
                        - path: src/Generated
