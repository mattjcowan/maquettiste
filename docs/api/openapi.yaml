    # ---------------------------------------------------------------- realtime payloads
    RealtimeModelChanged:
      description: '`model.changed` to every connection: the engine''s ChangeSet (cut to 200 KB, `truncated` then true). An `ElementChange` carries only id, kind, path and hash, so a change the editor did not make itself (an unknown id or a changed hash) cannot be patched into the index; the editor refetches `GET /api/model/index`.'
      allOf:
        - $ref: '#/components/schemas/ChangeSet'
      example:
        changed:
        - id: 01J92P0V0FJ23CGSNKM7P1W5V7
          kind: entity
          path: .maquettiste/model/entities/invoice.json
          hash: cdac722e6a2f7418b8f02fb4ab7097f297bd46bc67f46d9f61c45dfda534749d
        deleted: []
        source: editor
        truncated: false
        isEmpty: false
    RealtimeValidationCompleted:
      description: '`validation.completed` to every connection: a whole-model ValidationReport (cut to 200 KB; counts stay whole). The editor replaces its problems list with it, or refetches when `truncated`.'
      allOf:
        - $ref: '#/components/schemas/ValidationReport'
    RealtimeProjectChanged:
      description: '`project.changed` to every connection: settings, packs or extension schemas changed; refetch `GET /api/project` and the settings, and drop cached database views and previews (conventions and type maps change every resolved table). A `validation.completed` follows.'
      type: object
      required: [settingsHash]
      properties:
        settingsHash:
          $ref: '#/components/schemas/Hash'
    RealtimeJobProgress:
      description: '`job.progress` to `job:{id}`: the running JobInfo with its latest `progress`, at most four per second.'
      allOf:
        - $ref: '#/components/schemas/JobInfo'
    RealtimeJobCompleted:
      description: '`job.completed` to `job:{id}`: a fixed-size summary of the finished job (`JobCompletedEvent` in the functions), never the JobInfo. A finished JobInfo keeps `applyResult.staleUnits`, `.stalePaths`, `plan.request` and every diagnostic, which at S13 scale runs to megabytes, and the hub refuses payloads above 256 KB. On this event the editor reads `GET /api/jobs/{id}` and, for a plan job, `GET /api/generate/plan/{planId}`.'
      x-maquettiste-functions-record: JobCompletedEvent
      type: object
      required: [id, kind, state, outcome, planId, error, counts, finishedUtc]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          description: '`succeeded` whenever the run completed, whatever its outcome (see `JobState`).'
          allOf:
            - $ref: '#/components/schemas/JobState'
        outcome:
          description: '`planResult.outcome` or `applyResult.outcome`; `null` when the job ended without a result (cancelled before it ran, or an internal failure). What the editor reports.'
          oneOf:
            - $ref: '#/components/schemas/RunOutcome'
            - type: 'null'
        planId:
          description: The plan a plan job produced; `null` for an apply job or a plan job without a plan.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        error:
          description: The error of a failed job, cut to 2,000 characters.
          type: [string, 'null']
          maxLength: 2000
        counts:
          $ref: '#/components/schemas/JobCounts'
        finishedUtc:
          type: [string, 'null']
          format: date-time
      example:
        id: 01M3MNY0J2S7Q8C1V4E6T9R3KD
        kind: apply
        state: succeeded
        outcome: stale
        planId: null
        error: null
        counts:
          changes: 0
          staleUnits: 2
          stalePaths: 1
          errors: 0
          warnings: 0
        finishedUtc: '2026-09-28T19:02:41.3310452+00:00'
    JobCounts:
      description: Sizes of the lists a finished job holds, counted from the full record before the engine trims it.
      type: object
      required: [changes, staleUnits, stalePaths, errors, warnings]
      properties:
        changes:
          description: File decisions in the plan (plan job) or the run result (apply job).
          type: integer
          minimum: 0
        staleUnits:
          type: integer
          minimum: 0
        stalePaths:
          type: integer
          minimum: 0
        errors:
          description: Error diagnostics of the plan or the run result.
          type: integer
          minimum: 0
        warnings:
          type: integer
          minimum: 0
    RealtimePresenceChanged:
      description: '`presence.changed` to `editors`: every live editor connection and its selection.'
      type: object
      required: [editors]
      properties:
        editors:
          type: array
          items:
            $ref: '#/components/schemas/PresenceEntry'
    RealtimeSiteDeployed:
      description: '`site.deployed`, sent by the host to every page after a deploy, rollback or functions upload went live.'
      type: object
      required: [release, functions, source]
      properties:
        release:
          type: string
        functions:
          type: [string, 'null']
        source:
          type: string
          enum: [deploy, rollback, functions]
      example:
        release: 20260803-041429-5ab6
        functions: 20260803-052210-9c1f
        source: deploy
