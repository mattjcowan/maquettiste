          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRemoveResult'
        '422':
          description: The settings save was refused; nothing was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRemoveResult'
        '404':
          description: No such pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRemoveResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/rename:
    parameters:
      - $ref: '#/components/parameters/PackName'
    post:
      tags: [packs]
      operationId: renamePack
      summary: Rename a pack, keeping the files it generated tracked
      description: |
        `If-Match` carries the `pack.json` hash read. The new name follows the pack-name rule (lowercase letters and digits separated
        by single hyphens, starting with a letter) and must not be used by another pack folder, a `packs.<name>` settings entry or
        the manifests of a former pack. Moves the `packs.<pack>` entry of `maquettiste.json` to `packs.<name>` with its values
        (through the settings save), renames the folder `.maquettiste/templates/<pack>/` (never a copy), writes the new name into
        `pack.json`, and moves the pack's manifest and its unit states, so the files it generated stay tracked
        and no later run deletes them as orphans. Generation hints keyed by the old name are listed in `hints` and left as they are:
        the editor moves them with one model batch after the rename, so they are one undo step.
        With `dryRun` every check runs and the answer says what would move, writing nothing. Waits for a generation run in
        progress. 409 when `pack.json` changed (or `maquettiste.json` kept changing meanwhile); 422 (nothing changed) when the
        name is refused or the settings save is. Sends `project.changed` when the settings changed, then
        `templates.changed` (empty `files`) for both names and `packs.changed`. The ETag is the new `pack.json` hash.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.RenamePackAsync(pack, newName, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackRenameRequest'
            example:
              name: ddl
      responses:
        '200':
          description: Renamed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRenameResult'
              example:
                outcome: saved
                from: sql-ddl
                to: ddl
                hash: 3f1c9a2b7d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8
                current: null
                settingsHash: 9a8b7c6d5e4f30211203f4e5d6c7b8a9f0e1d2c3b4a5968778695a4b3c2d1e0f
                files: [README.md, _table.scriban, helpers.js, pack.json, schema.scriban, table.scriban]
                tracked: [db/main/billing/tables/customers.sql, db/main/schema.sql]
                hints: []
                hintsUpdated: []
                usesUpdated: []
                textReferences: []
                diagnostics: []
        '409':
          description: pack.json changed since it was read; `hash` and `current` are the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRenameResult'
        '422':
          description: The new name is not a pack name, is the current one, or is taken, or the settings save was refused; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRenameResult'
        '404':
          description: No such pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRenameResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/file:
    parameters:
      - $ref: '#/components/parameters/PackName'
      - $ref: '#/components/parameters/PackFilePath'
    get:
      tags: [packs]
      operationId: getPackFile
      summary: One pack file's text with its ETag
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ReadPackFileAsync(pack, path)
