          description: Moved; the ETag is the moved file's hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: A hash is stale, or something includes or names the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: The target exists, or `expectedPackHash` is missing with `updateUnits`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such source file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/extensions/files:
    get:
      tags: [extensions]
      operationId: listExtensionFiles
      summary: The custom property schemas, script rules and rows scripts of the model
      description: |
        The files of `.maquettiste/extensions/`: the extension schemas (`<name>.json`, custom properties) first, then the script rules
        (`rules/<name>.js`), then the seeds' rows scripts (`seeds/<name>.js`, kind `seed-rows`), each ordinal by path, with size, hash
        and what is wrong with the file on its own: an invalid schema (MQ5004), a rule script that does not load alone in the sandbox
        (MQ5002 for a syntax error or a registration without an id, MQ5003 for a limit), a rows script that does not load or does not
        call `maquettiste.rows` exactly once (MQ7127), with line and column, or a script that declares `let` or `var` at its top level
        (MQ5005, a warning). Then the custom kinds (`kinds/<type>.json`, kind `custom-kind`), with MQ1001 or MQ1002 when one does not
        parse or pass `custom-kind.json` and its own findings (MQ1017, MQ1018, MQ2009, MQ7212). Then the calculation files
        (`calculated/<name>.js`, kind `calculated`), each loaded alone: MQ5002 or MQ5003 when one does not load, MQ5005 for a top-level
        `let` or `var`, and `calculations`, what it declares. No rows script runs and no calculated value is evaluated. Rule findings
        (`x/<id>`) come from `POST /api/validate`; `resolved` marks a rule registered with scope "resolved".
      x-maquettiste-role: viewer
      x-maquettiste-engine: ModelStore.ListExtensionFilesAsync()
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionFileList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/extensions/file:
    parameters:
      - $ref: '#/components/parameters/ExtensionFilePath'
    get:
      tags: [extensions]
      operationId: getExtensionFile
      summary: One extension file's text with its ETag
      x-maquettiste-role: viewer
      x-maquettiste-engine: ModelStore.ReadExtensionFileAsync(path)
      responses:
        '200':
          description: The file.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [extensions]
      operationId: putExtensionFile
      summary: Write one extension file
      description: |
        `If-Match` with the hash read, or `If-None-Match: *` to create. The text must be UTF-8 with no NUL, at most 1 MB, and the
        write goes through the engine's model write guard. A schema must be JSON that passes `extension.json`, else 422 with its
        MQ5004 diagnostics and nothing written; it is written in canonical form and `text` returns what was written. A rule script is
        written as sent, then loaded alone in the sandbox: a syntax error or a registration without an id comes back at once in
        `diagnostics` (MQ5002 with line and column), as does the warning MQ5005 for a top-level `let` or `var`. The model is
        refreshed before the answer, `project.changed` is published and a validation follows, so the rule's `x/<id>` findings
        reach the Problems panel. A rows script (`seeds/<name>.js`) is written as sent and loaded alone, never run: one that does not
        load or does not register its rows exactly once comes back as MQ7127. A custom kind (`kinds/<type>.json`) must be JSON that
        passes `custom-kind.json`, else 422 (MQ1001, MQ1002); it is written in canonical form, and `diagnostics` carry its own findings
        and the MQ3033 findings of the elements of its type (at most 50, then a line with the count), which never refuse it. A
        calculation file (`calculated/<name>.js`) is written as sent and loaded alone, never evaluated: MQ5002, MQ5003 and MQ5005 come
        back at once. A path other than `<name>.json`, `rules/<name>.js`, `seeds/<name>.js`, `kinds/<type>.json` or
        `calculated/<name>.js`, or one through a link, is 400.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: ModelStore.WriteExtensionFileAsync(path, text, expectedHash)
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The hash read; required unless `If-None-Match` is `*`.
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionFileWrite'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '409':
          description: The file changed since it was read (or exists, on create); `hash` and `current` are the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '422':
          description: Not text, larger than 1 MB, or a schema or custom kind that is not valid; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [extensions]
      operationId: deleteExtensionFile
      summary: Delete one extension file
      description: |
        `If-Match` carries the file's hash. A custom kind that custom elements use is 422, with one MQ1019 per element that would
        lose its kind (at most 50, then a line with the count), and nothing is deleted.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: ModelStore.DeleteExtensionFileAsync(path, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '409':
          description: The file changed since it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '422':
          description: A custom kind that custom elements use; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '404':
          description: No such file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/extensions/file/move:
    post:
      tags: [extensions]
      operationId: moveExtensionFile
      summary: Rename one extension file within its kind
      description: |
        `If-Match` carries the source file's hash. The target must not exist and must be of the same kind (a schema stays a
        `<name>.json`, a rule a `rules/<name>.js`, a rows script a `seeds/<name>.js`, a custom kind a `kinds/<type>.json`, a
        calculation file a `calculated/<name>.js`), else 422.
        A custom kind that custom elements use is 422, with one MQ1019 per element that would lose its kind, as a delete is. Nothing
        else changes: a seed whose `rowsFrom.script` named the old path reports it missing (MQ7116) until it names the new one.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: ModelStore.MoveExtensionFileAsync(move, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionFileMove'
      responses:
        '200':
          description: Moved; the ETag is the moved file's hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '409':
          description: The source changed since it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '422':
          description: The target exists or is of another kind, or the source is a custom kind that custom elements use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '404':
          description: No such source file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/outputs:
    parameters:
      - $ref: '#/components/parameters/PackName'
    get:
      tags: [packs]
      operationId: getPackOutputs
      summary: The files a pack's manifest records
      description: Every manifest entry of the pack with its unit, element, root, mode and state on disk (`intact`, `edited`, `missing`; for a `block` output, the state of its lines in the file), and when the manifest was last written.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPackOutputsAsync(pack)
      responses:
        '200':
          description: The outputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackOutputs'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/plan/{id}/unit:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [generation]
      operationId: getPlanUnit
      summary: One unit of a plan with its reason, causes and grouped read keys
      description: '"Why not" for a skipped unit (generation-ui.md section 4.3): its recorded read keys grouped by cause kind and a one-sentence summary. The unit key travels as the `key` query parameter since it holds `/` and `:`.'
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPlanUnitAsync(planId, key)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanUnitDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/explain:
    post:
      tags: [generation]
      operationId: explainUnit
      summary: Why a unit does or does not render an element
      description: |
        The first reason that applies (generation-ui.md section 4.3): `pack-invalid`, `unknown-unit`, `pack-disabled`,
        `unknown-element`, `scope`, `selector`, `skip-hint`, `filter`; or, when the unit plans the element, the plan's reason
        and causes, from `planId` when that plan holds the unit, else from a new dry-run plan of the pack (which is stored like
        any plan and named by `planId` in the answer). Works for elements no plan contains.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ExplainAsync(pack, unit, elementId, planId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/presence:
    put:
      tags: [presence]
      operationId: reportPresence
      summary: Report this window's selection
      description: Stores the selection of one realtime connection that belongs to the caller and publishes `presence.changed` to `editors`. Idempotent; the editor sends it when the selection or workspace changes (debounced 250 ms) and after every reconnect.
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (functions state and IRealtime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceReport'
            example:
              connectionId: kP3v0lXq9Wm2Zs8TnB1c4A
              elementId: 01J92P0V0FJ23CGSNKM7P1W5V7
              workspace: entities
      responses:
        '204':
          description: Recorded.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/assist/status:
    get:
      tags: [assist]
      operationId: getAssistStatus
      summary: Whether the site's AI provider is configured, its kind and model, the budgets and today's usage
      description: |
        The assistant (SPEC Section 14 "Assist", erratum E44) uses the host's AI (`IAiChat`): the provider, its key and the
        model are chosen in the host's management UI (AI › providers; Sites › <site> › AI), never in Maquettiste. This
        reports what the functions can see of it (`IAiChat.IsConfigured`, `IAiChat.ProviderKind`, `IAiChat.Model`), the project's assistant settings
        (`assistant` in `maquettiste.json`), the caller's tokens spent today (UTC) and whether the caller may apply
        proposals (editor role or above).
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (IAiChat.IsConfigured, ProviderKind and Model, ProjectSettings.Assistant, the functions' usage file)
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistStatus'
              example:
                configured: false
                model: null
                providerKind: null
                hostAiUrl: http://localhost:8090/
                canApply: true
                maxTurns: 10
                tokenBudgetPerRequest: 200000
                tokenBudgetPerDayPerUser: 2000000
                usedToday: 0
                hasInstructions: false
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/assist/chat:
    post:
      tags: [assist]
      operationId: assistChat
      summary: Send one message to the assistant and stream its answer (server-sent events)
      description: |
        Runs the agent loop on the server: the conversation (stored per user and project; the browser sends only the new
        message and the conversation id, never tool turns, and any other member of the body is ignored), the system prompt
        (what Maquettiste is, the modeling conventions with the repository's `CONVENTIONS.md`, and `assistant.instructions`),
        the read tools the MCP server shares (`get_model_index`, `get_element`, `validate`, ...) and `propose_changes`. Each
        model turn is streamed; tool calls run on the server and their results go back to the model, up to
        `assistant.maxTurns` turns and `assistant.tokenBudgetPerRequest` tokens, after which the model must answer in text.
        `propose_changes` never writes: the batch is checked as a dry run and stored as a proposal the user applies through
        `POST /api/model/batch` or discards. The response is `text/event-stream`: each event is `event: <type>` and one
        `data:` line holding an `AssistEvent` JSON object; the stream ends after `final` or `error`. Closing the request
        stops the loop; what was answered so far is kept.
      x-maquettiste-role: viewer
      x-maquettiste-engine: AgentTools.CallAsync, AssistantProposals.PrepareAsync (ModelStore.PreviewBatchAsync), AssistantPrompt, IAiChat.StreamAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistChatRequest'
            example:
              conversationId: null
              message: Add an entity Shipment to the billing domain.
              context:
                workspace: entities
                elementId: 01J92P0V0FJ23CGSNKM7P1W5V7
                elementName: Invoice
                elementKind: entity
                selection: []
                problems: { errors: 0, warnings: 0, infos: 0, top: [] }
      responses:
        '200':
          description: The answer as server-sent events, one `AssistEvent` per event.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AssistEvent'
              example: |
                event: conversation
                data: {"type":"conversation","conversationId":"01M3MNY0HTVJQSH4BX78RWN8F7","title":"Add an entity Shipment"}

                event: text
                data: {"type":"text","delta":"I will read the model first."}

                event: final
                data: {"type":"final","text":"I proposed the entity.","stopReason":"stop","turns":3,"inputTokens":5120,"outputTokens":240,"usedToday":5360,"limited":null}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The conversation is already answering another message (`assist-busy`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The caller's token budget for the day is spent (`assist-budget-exhausted`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The site has no AI provider (`assist-not-configured`); see `GET /api/assist/status`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/assist/conversations:
    get:
      tags: [assist]
      operationId: listAssistConversations
      summary: The caller's conversations in this project, newest first
      description: The newest 50 are kept per user; each is capped in size (the oldest exchanges go first).
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (the functions' conversation store)
      responses:
        '200':
          description: The conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistConversationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/assist/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
    get:
      tags: [assist]
      operationId: getAssistConversation
      summary: One conversation as the panel shows it
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (the functions' conversation store)
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistConversation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [assist]
      operationId: deleteAssistConversation
      summary: Clear (delete) a conversation
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (the functions' conversation store)
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The conversation is answering a message (`assist-busy`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/assist/conversations/{id}/proposals/{proposalId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: proposalId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
    put:
      tags: [assist]
      operationId: setAssistProposalState
      summary: Record that the user applied or discarded a proposal
      description: |
        The editor applies a proposal itself (`POST /api/model/batch` with the proposal's `operations`, one undo step) and then
        records the outcome here, so the conversation shows it and the model hears of it with the next message. Only a
        `pending` proposal changes state.
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (the functions' conversation store)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistProposalStateRequest'
            example:
              state: applied
      responses:
        '200':
          description: The proposal with its new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proposal is no longer pending (`conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'


  # ------------------------------------------------ model snapshots (docs/engineering/snapshots.md)
  /api/snapshots:
    get:
      tags: [snapshots]
      operationId: listSnapshots
      summary: Every snapshot of the model, newest first
      description: |
        The archives under `.maquettiste/model-snapshots/`, newest first (then by id). Each row comes from the archive's
        `snapshot.json` (cached by file stamp), never from loading the model it holds.
      x-maquettiste-role: viewer
      responses:
        '200':
          description: The snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [snapshots]
      operationId: createSnapshot
      summary: Take a snapshot of the working model
      description: |
        Writes a deterministic zip of `maquettiste.json`, `model/`, `extensions/` and `branding/` (and `templates/` when
        `includePacks` is true) under `.maquettiste/model-snapshots/<id>.zip`. The id is the kebab-case name and the UTC time
        (`<slug>-<yyyymmdd-hhmmss>`, `-2` on a collision) and never changes. An explicit action: it reads the whole model folder,
        in parallel chunks streamed into the archive.
      x-maquettiste-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreateBody'
            example:
              name: Release 1 model
              description: What went to review on Monday.
              includePacks: false
      responses:
        '201':
          description: The snapshot. `Location` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/snapshots/compare:
    get:
      tags: [snapshots]
      operationId: compareSnapshots
      summary: What differs between two snapshots, or a snapshot and the working model
      description: |
        `from` and `to` are snapshot ids or `working` (`to` defaults to `working`). Documents are compared by hash first, so only
        the indexes are read: elements are matched by id (added, removed, or changed; a rename or a move says so with
        `previousName` and `previousPath`), the other documents (settings, locale shards, extensions, sidecars, branding, and the
        packs when both sides hold them) by path. The element list is ordered by kind, name and id and paged by `offset` and
        `limit`; `next` is the offset of the next page. The fields of one element come from `/api/snapshots/compare/element`.
      x-maquettiste-role: viewer
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
            default: working
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        '200':
          description: The differences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotComparison'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots/compare/element:
    get:
      tags: [snapshots]
      operationId: compareSnapshotElement
      summary: One element on both sides of a comparison
      description: |
        The element's two documents (`before` on the `from` side, `after` on the `to` side), in the form the conflict view renders
        them, and the fields that differ as JSON pointers (objects by key, arrays of objects with ids matched by id, other arrays
        by position when their lengths match, else whole), at most 500 (`fieldsTruncated`).
      x-maquettiste-role: viewer
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
            default: working
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The element on both sides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotElementDiff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots/import:
    post:
      tags: [snapshots]
      operationId: importSnapshot
      summary: Import an exported snapshot
      description: |
        The body is the archive, `Content-Type: application/zip` (the one body the sign-in gate takes that is not JSON). It is copied
        to the cache folder (512 MB at most), checked (a zip; every entry a safe path of the snapshot layout, no duplicate even
        ignoring case, at most 64 MB each, 4 GB together, 500,000 entries, no entry over 1 MB that expands more than 200 times; a
        `snapshot.json` of format 1 and a model format this release reads), rewritten the way the engine writes archives, and loaded
        once: a document that does not parse (MQ1001), is not canonical (MQ1003) or names an unsupported format (MQ1007) refuses it.
        It is stored under a new id; the working model is never touched. The host bounds a request body too (536,870,912
        bytes in static-site-hosting 0.4.0, the same 512 MiB): a body over it is the same 413 with `tooLarge` and MQ1011, and
        the command line (`maquettiste snapshot import`) has no such bound.
      x-maquettiste-role: maintainer
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The stored snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotImportResult'
        '413':
          description: The archive is over a size or count limit (MQ1011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotImportResult'
        '422':
          description: The archive is refused; `diagnostics` says why (MQ1011, MQ1001, MQ1003, MQ1007).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotImportResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/snapshots/{id}:
    parameters:
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [snapshots]
      operationId: getSnapshot
      summary: One snapshot
      x-maquettiste-role: viewer
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [snapshots]
      operationId: updateSnapshot
      summary: Rename, describe or publish a snapshot
      description: Rewrites only the archive's last entry, `snapshot.json`; the id and the documents stay as they are.
      x-maquettiste-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotPatchBody'
            example:
              published: true
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [snapshots]
      operationId: deleteSnapshot
      summary: Delete a snapshot
      x-maquettiste-role: maintainer
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/SnapshotId'
    post:
      tags: [snapshots]
      operationId: restoreSnapshot
      summary: Replace the working model with a snapshot's content
      description: |
        One operation: refused with 409 `run-locked` while a generation run holds the run lock (the restore then holds it); first a
        safety snapshot of the working model (`before-restore-<yyyymmdd-hhmmss>`, holding the packs when they are restored); then
        every document that differs is written and every document the snapshot does not have is deleted, all or nothing, and the
        model reloads and publishes one `model.changed`. The packs are restored only when the snapshot holds them and `includePacks`
        is true. Restoring the safety snapshot undoes it (`undo` says so); the editor's undo stack is not involved. The body is
        optional.
      x-maquettiste-role: maintainer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotRestoreBody'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRestoreResult'
        '409':
          description: A generation run holds the run lock (`run-locked`); nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The write was refused by the path policy (MQ6004); nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots/{id}/export:
    parameters:
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [snapshots]
      operationId: exportSnapshot
      summary: Download a snapshot's archive
      description: The archive as stored, which is the deterministic zip (`Content-Disposition` names it `<id>.zip`); `POST /api/snapshots/import` takes it back.
      x-maquettiste-role: editor
      responses:
        '200':
          description: The archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

webhooks:
  model.changed:
    post:
      tags: [realtime]
      operationId: realtimeModelChanged
      summary: 'Realtime event `model.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after every save, create, delete or batch, and after the file watcher or the periodic rescan indexes a change on disk.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeModelChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  validation.completed:
    post:
      tags: [realtime]
      operationId: realtimeValidationCompleted
      summary: 'Realtime event `validation.completed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after a whole-model validation that follows one or more model.changed or project.changed events (debounced 750 ms).'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeValidationCompleted'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  project.changed:
    post:
      tags: [realtime]
      operationId: realtimeProjectChanged
      summary: 'Realtime event `project.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent when maquettiste.json, a pack or an extension schema changed (a settings save or a disk change); a validation.completed follows.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeProjectChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  templates.changed:
    post:
      tags: [realtime]
      operationId: realtimeTemplatesChanged
      summary: 'Realtime event `templates.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent once per pack whose files changed, beside project.changed (never instead of it), by the watcher and by the pack writes of this API; packs.changed follows.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTemplatesChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  packs.changed:
    post:
      tags: [realtime]
      operationId: realtimePacksChanged
      summary: 'Realtime event `packs.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Names the packs of the templates.changed events just sent.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimePacksChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  jobs.cleared:
    post:
      tags: [realtime]
      operationId: realtimeJobsCleared
      summary: 'Realtime event `jobs.cleared` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after `DELETE /api/jobs` cleared the run history; read `GET /api/jobs` again.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobHistoryCleared'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  job.progress:
    post:
      tags: [realtime]
      operationId: realtimeJobProgress
      summary: 'Realtime event `job.progress` (group: job:{id})'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent while a job runs, at most four per second per job.'
      x-realtime-group: 'job:{id}'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeJobProgress'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  job.completed:
    post:
      tags: [realtime]
      operationId: realtimeJobCompleted
      summary: 'Realtime event `job.completed` (group: job:{id})'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent once, when a job finishes (state `succeeded`, `failed` or `cancelled`). A bounded summary: read `GET /api/jobs/{id}` for the record. Report the run by `outcome`, not `state`.'
      x-realtime-group: 'job:{id}'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeJobCompleted'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  presence.changed:
    post:
      tags: [realtime]
      operationId: realtimePresenceChanged
      summary: 'Realtime event `presence.changed` (group: editors)'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a window reports its selection (PUT /api/presence), or a connection of the editors group goes away.'
      x-realtime-group: 'editors'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimePresenceChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  site.deployed:
    post:
      tags: [realtime]
      operationId: realtimeSiteDeployed
      summary: 'Realtime event `site.deployed` (group: (all, sent by the host))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a deploy, rollback or functions upload of the editor site went live; the editor reloads itself.'
      x-realtime-group: '(all, sent by the host)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeSiteDeployed'
      responses:
        '200':
          description: Not applicable; realtime events have no response.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mq_session
      description: Set by `POST /api/session`. Host-only, HttpOnly, SameSite=Strict; protected with the host's data-protection keys; carries the user name, role, issue time and a fingerprint of the editor token.
    editorToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <MAQUETTISTE_EDITOR_TOKEN>`, the secret site variable. For the CLI, scripts and tests. Compared in fixed time. In local mode a loopback or `MAQUETTISTE_LOCAL_PEERS` caller with a local `Host` and no forwarding header needs neither scheme and is the local admin (see the authentication notes in `info`).'

  parameters:
    SnapshotId:
      name: id
      in: path
      required: true
      description: A snapshot id (`<slug>-<yyyymmdd-hhmmss>`).
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: release-1-model-20261005-120000
    SnapshotQuery:
      name: snapshot
      in: query
      required: false
      description: |
        Read the model "as of" this snapshot instead of the working model (docs/engineering/snapshots.md section 4): the snapshot is
        opened read-only from its archive and the answer carries `X-Maquettiste-Snapshot: <id>`; 404 when no snapshot has the id.
        Only the reads that list this parameter take it: the sign-in gate answers any other read that carries it with 400
        `snapshot-unsupported`, and any write with 409 `snapshot-read-only`.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    PackName:
      name: pack
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    ExtensionFilePath:
      name: path
      in: query
      required: true
      description: A path under the model's `extensions/` folder, `<name>.json` or `rules/<name>.js`.
      schema:
        type: string
    PackFilePath:
      name: path
      in: query
      required: true
      description: A pack-relative path with `/` separators (never a path segment).
      schema:
        type: string
    Locale:
      name: locale
      in: path
      required: true
      description: A declared BCP 47 locale other than the default.
      schema:
        type: string
        pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$'
    ProcessId:
      name: id
      in: path
      required: true
      description: A process id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JQPRC0000000000000000002
    ElementId:
      name: id
      in: path
      required: true
      description: An element or sub-element id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01J92P0V0FJ23CGSNKM7P1W5V7
    PlanId:
      name: id
      in: path
      required: true
      description: A plan id (the plan job's `planResult.plan.id`).
      schema:
        $ref: '#/components/schemas/Ulid'
    JobId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The hash the caller loaded, quoted as an ETag or bare. Missing is 428.
      schema:
        type: string
        pattern: '^(W/)?"?[0-9a-f]{64}"?$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    FilterKind:
      name: kind
      in: query
      description: Only this kind.
      schema:
        $ref: '#/components/schemas/ElementKind'
    FilterPackage:
      name: package
      in: query
      description: Only elements directly in this package, by package id or package name (ignoring case).
      schema:
        type: string
    FilterTag:
      name: tag
      in: query
      description: Only elements with this tag key.
      schema:
        type: string
    FilterCategory:
      name: category
      in: query
      description: Only elements in this category (its id).
      schema:
        type: string
    FilterStereotype:
      name: stereotype
      in: query
      description: Only elements with this stereotype key.
      schema:
        type: string
    FilterQuery:
      name: query
      in: query
      description: Only elements whose name contains this text, ignoring case.
      schema:
        type: string
    PageCursor:
      name: cursor
      in: query
      description: The `next` of the previous page, as it was returned (opaque; it encodes the last position read).
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: The page size, 1 to 1000; 100 when absent. Out of range is `bad-request`.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  headers:
    ETag:
      description: The element's hash as a strong ETag.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IndexETag:
      description: The index's hash as a strong ETag (E5e).
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    NoCache:
      description: '`no-cache`: the client may keep the response but revalidates it with `If-None-Match` before each use (E5e).'
      schema:
        type: string
        const: no-cache

    NextLink:
      description: 'While more rows follow a paged answer: `<url>; rel="next"`, the same request with `cursor` set to the next page''s.'
      schema:
        type: string
      example: '</api/model/index?kind=entity&limit=100&cursor=cDEAZW50aXR5AEludm9pY2UAMDFKOTJQMFYwRkoyM0NHU05LTTdQMVc1Vjc>; rel="next"'

  responses:
    Forbidden:
      description: The caller's role is below the one the operation needs (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: This needs the maintainer role.
            status: 403
            code: forbidden
    BadRequest:
      description: The body is not JSON or not the expected shape (`bad-request`), or is larger than 4 MB (`too-large`). The sign-in gate refuses a `POST` or `PUT` that is not `application/json` with 415 `unsupported-media-type`, and a foreign `Origin` with 403 `forbidden-origin`, before any handler runs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The request body is not valid JSON.
            status: 400
            code: bad-request
            detail: "'}' is invalid after a value. Expected either ',', '}', or ']'. LineNumber: 3 | BytePositionInLine: 2."
    Unauthenticated:
      description: No valid credential (`unauthenticated`), or a wrong token (`bad-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Sign in to use the editor.
            status: 401
            code: unauthenticated
    NotFound:
      description: No such element, diagram, plan, path in the plan, job or connection (`not-found`, `not-a-diagram`, `not-a-database`, `not-a-query`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: No element has the id 01J92P0V0FJ23CGSNKM7P1W5V9.
            status: 404
            code: not-found
    PreconditionRequired:
      description: A save or delete without `If-Match` (`precondition-required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Send the hash you loaded in If-Match.
            status: 428
            code: precondition-required
    QueueFull:
      description: Sixteen jobs are already queued (`queue-full`). Retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The job queue is full.
            status: 503
            code: queue-full
    ModelUnavailable:
      description: The model folder cannot be read (`model-unavailable`), for example a missing bind mount.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    JobFinished:
      description: The job already finished (`job-finished`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many failed sign-ins from this address (`too-many-attempts`); five per minute.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------------------------------------------------------------- scalars
    Ulid:
      description: Uppercase Crockford ULID (engine-design.md D1).
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    Hash:
      description: Lowercase hex SHA-256.
      type: string
      pattern: '^[0-9a-f]{64}$'
    RepoPath:
      description: A repo-relative path with forward slashes.
      type: string

    # ---------------------------------------------------------------- errors, session, health
    Problem:
      description: RFC 9457 problem details (`application/problem+json`), from `Results.Problem`. `code` is stable; `title` and `detail` are for people.
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad-request
            - unsupported-media-type
            - too-large
            - unauthenticated
            - bad-token
            - too-many-attempts
            - forbidden
            - forbidden-origin
            - not-found
            - not-a-diagram
            - not-a-database
            - not-a-query
            - invalid-icon
            - precondition-required
            - queue-full
            - job-finished
            - model-unavailable
            - superseded
            - conflict
            - internal
            - assist-not-configured
            - assist-budget-exhausted
            - assist-busy
            - run-locked
            - snapshot-read-only
            - snapshot-unsupported
        traceId:
          type: string
    SignInRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
        returnUrl:
          type: string
          description: Form posts only; a local path to redirect to.
    SessionUser:
      type: object
      required: [name, displayName, role]
      properties:
        name:
          type: string
          description: The name realtime presence and PublishToUserAsync use.
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [viewer, editor, maintainer, admin]
    SessionInfo:
      type: object
      required: [user, via, mode]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        via:
          type: string
          enum: [local, token, cookie]
        mode:
          type: string
          enum: [local, hosted]
    EditorHealth:
      type: object
      required: [status, productVersion, build, engineVersion, engineBuild, modelLoaded, elements, worker, watcher]
      properties:
        status:
          type: string
          enum: [ok, starting, degraded]
          description: '`starting` until the first load finished; `degraded` when the model folder is unreadable or a background service keeps failing.'
        productVersion:
          type: string
          description: 'The release running (`EngineVersion.Product`), such as `0.5.3`: the version `maquettiste --version` prints first and the image''s `org.opencontainers.image.version` label. Compare this one to know which release answers.'
        build:
          type: string
          description: 'The build of that release (`EngineVersion.Build`): `productVersion` locally; in the image, the per-build package version of `/opt/maquettiste/engine.version`, such as `0.5.3-b14a8131cfe39`.'
        engineVersion:
          type: string
          description: '`EngineVersion.Value`, the engine contract version that packs'' `engine` ranges are checked against. It is not the release: see `productVersion`.'
        engineBuild:
          type: string
          description: The loaded engine assembly's informational version without any `+` suffix (the same value as `build`); in the image, the per-build package version of `/opt/maquettiste/engine.version` (`phase2-design.md` PD24), so an upgrade check can see which engine the functions compiled against.
        modelLoaded:
          type: boolean
        elements:
          type: integer
        worker:
          type: string
          enum: [running, stopped]
        watcher:
          type: string
          enum: [watching, polling, stopped]
          description: '`polling` when the file watcher failed and only the periodic rescan runs.'

    # ---------------------------------------------------------------- project
    ProjectInfo:
      description: Composed by the functions from the snapshot, the pack list (E2) and git.
      type: object
      required: [name, formatVersion, engineVersion, productVersion, build, workspace, branch, worktree, repository, mode, settings, settingsHash, databases, packs, packDiagnostics, extensions, git]
      properties:
        name:
          type: string
          description: '`settings.name`, else the repo folder name.'
        formatVersion:
          type: integer
        engineVersion:
          type: string
          description: 'The engine contract version (`EngineVersion.Value`) that packs'' `engine` ranges are checked against; not the release (see `productVersion`).'
        productVersion:
          type: string
          description: 'The release running (`EngineVersion.Product`), such as `0.5.3`; the same as `GET /api/health` `productVersion`.'
        build:
          type: string
          description: 'The build of that release (`EngineVersion.Build`); in the image, the content of `/opt/maquettiste/engine.version`.'
        workspace:
          type: [string, 'null']
          description: 'What the served checkout is called, shown in the top bar beside the release: the `MAQUETTISTE_WORKSPACE` variable (trimmed) when set, else `branch`, else the short commit of a detached head, else `worktree`; null when none is known. Read from `.git` on each request, without running git.'
        branch:
          type: [string, 'null']
          description: 'The branch in `.git/HEAD` (the nearest `.git` at or above the repository root), or null on a detached head, outside git, or for a linked worktree whose git folder is not mounted (a container that mounts the worktree alone).'
        worktree:
          type: [string, 'null']
          description: 'The name of a linked worktree (the last segment of the git folder its `.git` file names), or null for a main checkout.'
        repository:
          type: [string, 'null']
          description: 'The folder name of the main checkout a linked worktree belongs to, as its `.git` file names it; null otherwise.'
        mode:
          type: string
          enum: [local, hosted]
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        settingsHash:
          $ref: '#/components/schemas/Hash'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/ElementSummary'
        packs:
          type: array
          description: Every pack under `.maquettiste/templates/`, enabled or not (`settings.packs` says which run).
          items:
            $ref: '#/components/schemas/PackManifest'
        packDiagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        extensions:
          type: array
          description: Extension schemas; the inspector renders custom properties from them.
          items:
            $ref: '#/components/schemas/ExtensionSchema'
        git:
          description: Read-only status for the top bar; `null` when the repo is not a git checkout or git is unavailable.
          oneOf:
            - $ref: '#/components/schemas/GitSummary'
            - type: 'null'
        iconHash:
          description: The content hash of the icon `GET /api/project/branding/icon` serves (use it to refresh the icon), or null without a usable one. An older server leaves it out.
          type: [string, 'null']
        projectKey:
          description: A stable identity of the checkout the host serves (the first 16 hex digits of the SHA-256 of its full root path), so the editor keeps per-project browser state (page state) apart for two projects with one name and across a rename. Not a secret and not a path. An older server leaves it out (the editor then keys by `name`); null from the MCP `get_project` tool, which serves no editor.
          type: [string, 'null']
          pattern: '^[0-9a-f]{16}$'
    GitSummary:
      type: object
      required: [branch, head, changedModelFiles]
      properties:
        branch:
          type: [string, 'null']
          description: '`null` on a detached head.'
        head:
          type: [string, 'null']
        changedModelFiles:
          type: integer
          description: Files under `.maquettiste/` that `git status --porcelain` lists.
    SettingsDocument:
      x-engine-addition: E3
      x-engine-record: Maquettiste.Engine.SettingsDocument
      type: object
      required: [settings, path, hash, json]
      properties:
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        path:
          $ref: '#/components/schemas/RepoPath'
        hash:
          $ref: '#/components/schemas/Hash'
        json:
          $ref: '../../schemas/v1/maquettiste.json'
    SettingsSaveResult:
      x-engine-addition: E3
      x-engine-record: Maquettiste.Engine.SettingsSaveResult
      type: object
      required: [outcome, hash, current, diagnostics]
      properties:
        outcome:
          $ref: '#/components/schemas/SaveOutcome'
        hash:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
        current:
          oneOf:
            - $ref: '#/components/schemas/SettingsDocument'
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        facts:
          description: >-
            When saved, the migration facts the save recorded: a change of `conventions`, `databases`, `typeMaps` or `inflection`
            classifies every database; other settings record none. `null` when nothing was written.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/RecordedFact'
            - type: 'null'
    ProjectSettings:
      x-engine-record: Maquettiste.Engine.Model.ProjectSettings
      type: object
      required: [$schema, formatVersion, name, properties, outputs, handEdits, formatters, conventions, databases, typeMaps, inflection, packs, validation, limits]
      properties:
        $schema:
          type: [string, 'null']
        formatVersion:
          type: integer
        name:
          type: [string, 'null']
        properties:
          description: The project's own properties, key to text (Settings › General); every pack's templates read them as `project.properties`.
          type: object
          additionalProperties:
            type: string
        outputs:
          type: object
          required: [allow, deny]
          properties:
            allow:
              description: Folders generation may write under; an entry also allows the file of its own path (such as `.gitignore`) unless it ends with `/`. A `commit` member of an older file is ignored (MQ1010).
              type: array
              items:
                type: object
                required: [path]
                properties:
                  path:
                    type: string
            deny:
              type: array
              items:
                type: string
        handEdits:
          $ref: '#/components/schemas/HandEditPolicy'
        formatters:
          type: array
          items:
            type: object
            required: [name, extensions, command, args, version, versionArgs, timeoutSeconds]
            properties:
              name:
                type: string
              extensions:
                type: array
                items:
                  type: string
              command:
                type: string
              args:
                type: array
                items:
                  type: string
              version:
                type: string
              versionArgs:
                type: array
                items:
                  type: string
              timeoutSeconds:
                type: integer
        conventions:
          $ref: '#/components/schemas/Conventions'
        databases:
          type: object
          description: Per-database convention overrides, by database name.
          additionalProperties:
            $ref: '#/components/schemas/Conventions'
        typeMaps:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        inflection:
          type: object
          required: [plurals, uncountable]
          properties:
            plurals:
              type: object
              additionalProperties:
                type: string
            uncountable:
              type: array
              items:
                type: string
        localization:
          description: Localization of the standard fields (reference-types-seeds-localization.md section 3.2); `null` when the project declares none.
          oneOf:
            - $ref: '#/components/schemas/LocalizationSettings'
            - type: 'null'
        referenceData:
          $ref: '#/components/schemas/ReferenceDataSettings'
        packs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PackSettings'
        uses:
          description: The packs whose helpers the project's own scripts may call through `maquettiste.use`.
          type: array
          items:
            $ref: '#/components/schemas/PackUse'
        validation:
          type: object
          required: [rules]
          properties:
            rules:
              type: object
              additionalProperties:
                type: string
        limits:
          type: object
