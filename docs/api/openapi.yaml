    get:
      tags: [generation]
      operationId: getPlanDiff
      summary: Unified diff for one file in a plan
      description: From the file on disk now to the planned bytes, without rendering again. Empty for a file the plan leaves unchanged or keeps; a deleted file diffs to nothing.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPlanDiffAsync(planId, path)
      parameters:
        - name: path
          in: query
          required: true
          description: A repo-relative path from the plan's `changes` or `units[].outputs`.
          schema:
            type: string
          example: db/main/billing/tables/customers.sql
      responses:
        '200':
          description: The unified diff (`--- a/`, `+++ b/`, hunks).
          content:
            text/x-diff:
              schema:
                type: string
              example: |
                --- a/db/main/billing/tables/customers.sql
                +++ b/db/main/billing/tables/customers.sql
                @@ -0,0 +1,14 @@
                +-- Generated by Maquettiste (sql-ddl/table). Do not edit; changes are overwritten.
                +-- Table billing.customers of database main (PostgreSQL 16).
                +-- Maps entity Customer.
                +
                +CREATE TABLE billing.customers (
                +    id uuid NOT NULL,
                +    name varchar(120) NOT NULL,
                +    email varchar(254) NOT NULL,
                +    customer_since date NULL,
                +    created_at timestamptz(6) NOT NULL,
                +    updated_at timestamptz(6) NULL,
                +    CONSTRAINT pk_customers PRIMARY KEY (id),
                +    CONSTRAINT uq_customers_email UNIQUE (email)
                +);
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/apply:
    post:
      tags: [generation]
      operationId: startApply
      summary: Apply a plan by id as a job
      description: The job's `applyResult.outcome` is `stale` (with `staleUnits` and `stalePaths`, nothing written) when any input or planned path changed since planning, `failed` when the plan is unknown or its stored bytes are gone, `invalid` when the plan or the model now has errors. Only `failed` (and `cancelled`) change the job's `state`; a `stale`, `invalid` or `conflicts` apply is a job in state `succeeded`, so check `applyResult.outcome`.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: JobQueue.TryEnqueue(new JobRequest(JobKind.Apply, null, planId))
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
            example:
              planId: 01M3MNY0HY08AVTKW927JJPSEF
      responses:
        '202':
          description: Queued.
          headers:
            Location:
              description: /api/jobs/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
        '503':
          $ref: '#/components/responses/QueueFull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
