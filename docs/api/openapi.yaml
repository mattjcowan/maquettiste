  /api/model/format:
    post:
      tags: [model]
      operationId: formatModel
      summary: Rewrite model files in canonical form
      description: |
        What `maquettiste format` does, from the editor: rewrites `maquettiste.json` (dropping the retired `commit` flag of an
        `outputs.allow` entry, MQ1010), the element files under `model/` and the locale shards in canonical form, so their MQ1003
        findings go away. `paths` absent rewrites every model file. A file already in canonical form is not touched; a file that is
        not valid enough to rewrite (not JSON, no known kind, a schema error) is left as it is and listed in `skipped`. The files are
        written together through the model store, so `model.changed` follows (and `project.changed` when `maquettiste.json` was
        rewritten). A format changes no content, only bytes, so it adds no undo step. A path that is not a model file (outside the
        model folder, an extension, a pack file, a missing file) refuses the request with 400 and nothing is written.
      x-maquettiste-role: editor
      x-maquettiste-engine: ModelStore.FormatAsync(paths, ChangeSource.Editor)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelFormatRequest'
            example:
              paths: [.maquettiste/maquettiste.json]
      responses:
        '200':
          description: The files rewritten and the files left as they are.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFormatResult'
              example:
                formatted: [.maquettiste/maquettiste.json]
                skipped: []
                refused: []
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/model/batch:
    post:
      tags: [model]
      operationId: applyBatch
      summary: Atomic multi-element change
      description: |
        Refactorings, bulk edits, undo and redo, and pasted or proposed changes. The body is validated against
        `schemas/v1/batch.json` before any disk access, then the whole batch is validated in memory, each expected hash
        is checked, and every file is staged and renamed into place; on any failure nothing is written. Failed items carry
        their outcome; the other items report `saved` with no hash.
      x-maquettiste-role: editor
      x-maquettiste-engine: ModelStore.ParseBatch then ModelStore.ApplyBatchAsync(batch, ChangeSource.Editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/v1/batch.json'
            examples:
              createEntity:
                summary: Create one entity
                value:
                  operations:
                  - op: create
                    element:
                      kind: entity
                      name: Shipment
                      package: 01J92P0V01KDRN8GX5PGYCNKSX
      responses:
        '200':
          description: Every operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '409':
          description: An expected hash was stale (`conflict`) or a delete was refused (`referenced`); nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '404':
          description: An update or delete named an unknown id; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '422':
          description: The batch did not parse (`BatchParseResult`, `batch` null) or an operation is invalid (`BatchResult`); nothing was written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchResult'
                  - $ref: '#/components/schemas/BatchParseResult'
              examples:
                invalidItem:
                  summary: A created entity without a key
                  value:
                    outcome: invalid
                    items:
                    - outcome: invalid
                      id: 01M3MNY0GZHRR68GZ2SZRGKF0D
                      hash: null
                      current: null
                      diagnostics:
                      - rule: MQ3005
                        severity: error
                        message: Entity 'Shipment' has no key; add 'key', or make it abstract or derived.
                        elementId: 01M3MNY0GZHRR68GZ2SZRGKF0D
                        filePath: .maquettiste/model/entities/shipment.json
                        jsonPointer: ''
                        line: 1
                        column: 1
                      referrers: []
                      changes: null
                    changes: null
                unparsable:
                  summary: An unknown op
                  value:
                    batch: null
                    diagnostics:
                    - rule: MQ1002
                      severity: error
                      message: '/operations/0/op enum: Value should match one of the values specified by the enum'
                      elementId: null
                      filePath: null
                      jsonPointer: /operations/0/op
                      line: 1
                      column: 22
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

