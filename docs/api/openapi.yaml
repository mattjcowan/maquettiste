          type: object
          additionalProperties:
            type: string
        minted:
          description: The ids the engine minted, in operation and document order.
          type: array
          items:
            $ref: '#/components/schemas/MintedId'
    MintedId:
      x-engine-record: Maquettiste.Engine.MintedId
