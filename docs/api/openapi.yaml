          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: verifyScenarios
      summary: Replay a process's scenarios and report each one's first failure
      description: |
        phase-3-design.md sections 3 and 4.4. Every scenario of the process (or the ids or names in `scenarios`) is replayed through
        the engine interpreter; `failure` is the first failed expectation (MQ9301 to MQ9304) or the stop that kept the replay from the
        last step (MQ9305, MQ9306, MQ9507; `expected` and `actual` are then null). Results are ordered by name, then id.
      x-maquettiste-role: viewer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              scenarios: [01JQSCN0000000000000000010]
      responses:
        '200':
          description: One result per scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
              example:
                process: 01JQPRC0000000000000000002
                results:
                  - scenario: 01JQSCN0000000000000000010
                    name: BudgetRejected
                    passed: true
                    steps: 3
                    failure: null
                passed: true
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    get:
      tags: [processes]
      operationId: exportProcess
      summary: Export a process as an XState machine config
      description: |
        phase-3-design.md section 5.1. The config in canonical key order (two-space indent, `\n` line ends, a trailing newline); what
        has no XState home travels under `meta.maquettiste`, so importing the export over the process gives the same file.
        `X-Maquettiste-Diagnostics` counts the MQ9406 notes (what went into `meta`); `X-Maquettiste-Warnings` counts the other
        diagnostics (MQ9404: a kept opaque pointer that has no place in the config and was dropped). The CLI prints those to stderr
        and the MCP tool returns every diagnostic in a second content block.
      x-maquettiste-role: viewer
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xstate]
            default: xstate
      responses:
        '200':
          description: The XState config.
          headers:
            X-Maquettiste-Diagnostics:
              description: The number of MQ9406 notes.
              schema:
                type: integer
                minimum: 0
            X-Maquettiste-Warnings:
              description: The number of other export diagnostics (MQ9404).
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                required: [id, states]
                additionalProperties: true
              example:
                id: PurchaseApproval
                initial: Drafting
                states:
                  Drafting:
                    id: 01JQSTA0000000000000000101
                    on:
                      submit:
                        - target: ['#01JQSTA0000000000000000102']
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/import:
    post:
      tags: [processes]
      operationId: importProcess
      summary: Preview or apply an XState machine config import
      description: |
        phase-3-design.md sections 5.1 and 5.2. `?dryRun=true` (the default) returns the process document the import gives with its
        diagnostics (MQ9401 to MQ9406) and the ids it creates, writing nothing. `into` re-imports over an existing process (id or
        name), keeping the ids of the nodes it matches; `removed` lists what it drops. With `dryRun=false` the document is saved as
        one change: 409 when `into` changed since `expectedHash`, 422 when the import has errors or the process does not validate.
      x-maquettiste-role: editor
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xstate]
            default: xstate
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessImportRequest'
            example:
              config:
                id: Door
                initial: Closed
                states:
                  Closed:
                    on:
                      open: Opened
                  Opened:
                    on:
                      close: Closed
              package: purchasing
              use: orchestration
      responses:
        '200':
          description: The preview, or the saved import (`applied` true, `hash`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
              example:
                document:
                  kind: process
                  id: 01JQPRC0000000000000000099
                  name: Door
                  states: []
                diagnostics: []
                created: [01JQPRC0000000000000000099]
                removed: []
                applied: false
                id: 01JQPRC0000000000000000099
                hash: null
        '409':
          description: '`into` changed since `expectedHash`; nothing was written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The import has errors, or the process does not validate; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessImportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/sync-enum:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: syncEnumFromProcess
      summary: Sync a lifecycle's bound enum with its root-level states
      description: |
        phase-3-design.md sections 3 and 4.4, the `sync-enum` batch operation. The bound enum's members become the root-level states in
        document order (ids, codes and descriptions kept). `dryRun: true` returns the plan. A member still used by a default,
        `allowedValues`, a seed cell or a scenario value is listed in `refused` and not removed: there is no force flag, change the uses
        first (applying such a plan is 422 with MQ9019). 409 when the process changed since `expectedHash`.
      x-maquettiste-role: editor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncEnumRequest'
            example:
              dryRun: true
      responses:
        '200':
          description: The plan, applied unless `dryRun`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
              example:
                process: 01JQPRC0000000000000000001
                enum: 01JQENM0000000000000000001
                added: [OnHold]
                removed: []
                reordered: false
                refused: []
                applied: false
                diagnostics: []
        '409':
          description: The process changed since `expectedHash`; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The process is not a bound lifecycle, or a removal is refused (MQ9019 in `diagnostics`); nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnumResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

