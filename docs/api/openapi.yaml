  /api/project/settings:
    get:
      tags: [project]
      operationId: getSettings
      summary: The canonical maquettiste.json with its hash
      x-maquettiste-role: viewer
      x-engine-addition: E3 ModelStore.GetSettingsAsync
      responses:
        '200':
          description: The settings document.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [project]
      operationId: saveSettings
      summary: Save maquettiste.json (conventions, type maps, outputs, packs)
      x-maquettiste-role: admin
      x-engine-addition: E3 ModelStore.SaveSettingsAsync
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/v1/maquettiste.json'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '409':
          description: The file changed on disk since it was loaded; `current` is the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '422':
          description: The settings are invalid; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/project/branding/icon:
    get:
      tags: [project]
      operationId: getBrandingIcon
      summary: The project icon named by settings `branding.icon`
      description: |
        Anonymous, so the sign-in page and the browser tab can show it. An SVG is served without the parts MQ8003 names (scripts,
        event handlers, external references), with `Content-Security-Policy` `sandbox` and `nosniff`. The ETag is the served bytes'
        hash (`iconHash` in `GET /api/project`); `If-None-Match` answers 304.
      security: []
      x-maquettiste-role: anonymous
      x-engine-addition: ModelStore.ReadBrandingIconAsync
      responses:
        '200':
          description: The icon.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The icon has the hash sent in `If-None-Match`.
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [project]
      operationId: uploadBrandingIcon
      summary: Store the project icon under .maquettiste/branding/
      description: |
        The body is JSON, as every write of the API: `{ contentType, data }` with the file in base64. An SVG or a PNG of at most
        512 KB; an SVG is stored without its scripts, event handlers, external references and processing instructions (listed in
        `removed`). The file is written under a content-addressed name, `branding/icon-<12 hex>.svg` or `.png`, in the model
        folder, so an upload never replaces the icon the saved settings name; `maquettiste.json` is not changed: save
        `branding.icon` with the returned `icon` through `PUT /api/project/settings`. That save removes the uploaded icons the
        settings no longer name.
      x-maquettiste-role: admin
      x-engine-addition: ModelStore.SaveBrandingIconAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingIconUpload'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingIconSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: The icon is over 512 KB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Not a PNG, or not well-formed SVG with an `<svg>` root in the SVG namespace; nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/project/settings/packs/{pack}:
    parameters:
      - $ref: '#/components/parameters/PackName'
    put:
      tags: [project]
      operationId: savePackSettings
      summary: Save one pack's entry of maquettiste.json
      description: Replaces `packs.<pack>` (enabled, output, parameters) and nothing else in the file, with the settings ETag; an empty object removes the entry. The save is validated as `saveSettings` is (MQ6023 and MQ6024 among its diagnostics) and publishes `project.changed`.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.SavePackSettingsAsync(pack, section, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Saved; the ETag is the settings hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '409':
          description: The settings changed since they were read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '422':
          description: The settings would be invalid; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/model/index:
    get:
      tags: [model]
      operationId: getModelIndex
      summary: Summaries of every element
      description: |
        One summary per top-level element (sub-elements such as attributes and relation ends are not listed). The explorer,
        the command palette and every canvas start from this list.

        E5e: the response carries an `ETag`, a hash of every row's id, file hash and path and of the index format, so it
        changes exactly when a row does, across server restarts too. The index format constant is `maquettiste-index/e6`.

        `?locale=<tag>` (a declared locale; the default locale is the same as none) fills `displayName` from that locale's fallback
        chain (reference-types-seeds-localization.md section 3.8) from a per-locale display-name table the host builds once per
        snapshot; the ETag then also covers the locale, its chain and the hashes of the chain's shards. 400 for an undeclared locale. A request whose `If-None-Match` names it gets 304 with no
        body. `Cache-Control: no-cache` lets the browser keep the index and revalidate it on every use.

        The index filters (`kind`, `package`, `tag`, `category`, `stereotype`, `query`; all optional, combined with AND) narrow the
        list, as `getElements` and the MCP tool `get_model_index` take them. `limit` or `cursor` pages it: the body is then one page
        of rows ordered by kind, name and id (ordinal), and while more rows follow, a `Link` header with `rel="next"` gives the URL of
        the next page (the same query with `cursor` set). A filtered or paged answer carries no ETag and `Cache-Control: no-store`.
        Use the index to find elements, `getElements` to read their documents in bulk, `getResolvedModel` for what generation sees,
        and `getModelKinds` for the counts.
      x-maquettiste-role: viewer
      x-maquettiste-engine: ModelStore.GetIndexAsync, ModelPages.Filter, ModelPages.PageIndex
      x-engine-addition: E5e ModelReads.IndexTag(summaries)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: locale
          in: query
          description: A declared locale whose display names fill `displayName`.
          schema:
            type: string
            pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$'
        - $ref: '#/components/parameters/FilterKind'
        - $ref: '#/components/parameters/FilterPackage'
        - $ref: '#/components/parameters/FilterTag'
        - $ref: '#/components/parameters/FilterCategory'
        - $ref: '#/components/parameters/FilterStereotype'
        - $ref: '#/components/parameters/FilterQuery'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: The index, or one page of it.
          headers:
            ETag:
              $ref: '#/components/headers/IndexETag'
            Cache-Control:
              description: '`no-cache` for the whole index (revalidate with `If-None-Match`), `no-store` for a filtered or paged answer.'
              schema:
                type: string
                enum: [no-cache, no-store]
            Link:
              $ref: '#/components/headers/NextLink'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementSummary'
              examples:
                billing:
                  summary: Part of the billing fixture's index
                  value:
                    - id: 01J92P0V01KDRN8GX5PGYCNKSX
                      kind: package
                      name: Billing
                      package: null
                      tags: []
                      category: null
                      stereotypes: []
                      hash: 28aadbb9e1c11cdd89539991fa4ced5d566312d0a62c7692bb7e5789cce923b2
                      path: .maquettiste/model/packages/billing.json
                    - id: 01J92P0V0FJ23CGSNKM7P1W5V7
                      kind: entity
                      name: Invoice
                      package: 01J92P0V01KDRN8GX5PGYCNKSX
                      tags:
                      - billing
                      category: 01J92P0V06TYE8P8990AV35A8K
                      stereotypes: 
                      - aggregate-root
                      - audited
                      - soft-delete
