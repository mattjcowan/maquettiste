  /api/packs/{pack}:
    parameters:
      - $ref: '#/components/parameters/PackName'
    get:
      tags: [packs]
      operationId: getPack
      summary: pack.json with its ETag, parameters, files and diagnostics
      description: |
        `document` is `pack.json` as written (every member, `null` when it is not JSON). `parameters` joins the defaults, the
        `parameterSchema` properties and the project values of `packs.<pack>.parameters`. `files` lists the folder with sizes,
        hashes (each file's ETag), roles and users. `diagnostics` holds the load diagnostics (MQ6001, MQ6002, MQ6021 to MQ6024),
        MQ6019 for output paths outside every root and MQ6003 / MQ6025 for templates that do not parse.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPackAsync(pack)
      responses:
        '200':
          description: The pack.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [packs]
      operationId: savePack
      summary: Save the whole pack.json document in canonical form
      description: Every member is kept (`version`, `description`, `engine`, `scripts`, `usesSchemaDiff`, `units`, `parameters`, `parameterSchema`). A schema failure (MQ6001, MQ6021) or a `name` that is not the folder is 422 and writes nothing; unit problems (MQ6019, MQ6022) are saved and reported in `diagnostics`.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.SavePackAsync(pack, document, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/v1/pack.json'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: pack.json changed since it was read; `hash` and `current` are the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: The document is invalid; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    delete:
      tags: [packs]
      operationId: deletePack
      summary: Remove a pack, leaving the files it generated on disk
      description: |
        `If-Match` carries the `pack.json` hash read. Removes the `packs.<pack>` entry of `maquettiste.json` (through the settings
        save), then the folder `.maquettiste/templates/<pack>/`, then the pack's manifest and its unit states.
        The files the pack generated stay on disk and are no longer tracked: `untracked` lists them. Waits for a generation run in
        progress. 409 when `pack.json` changed (or `maquettiste.json` kept changing meanwhile); 422 (nothing removed) when the settings save is refused. Sends `project.changed`
        when the settings changed, then `templates.changed` (empty `files`) and `packs.changed`.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.DeletePackAsync(pack, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRemoveResult'
        '409':
