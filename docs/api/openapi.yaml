                      content:
                        type: string
                        description: The CSV text.
                      hash:
                        type: string
                        description: The seed hash read for the preview; the current one when absent.
      responses:
        '200':
          description: One preview (or result) per file, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedsImportResult'
