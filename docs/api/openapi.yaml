    LockMode:
      type: string
      enum: [wait, fail]
    RunOutcome:
      type: string
      enum: [succeeded, invalid, drift, conflicts, busy, stale, cancelled, failed]
    PipelineStage:
      type: string
      enum: [load, validate, resolve, plan, skip, render, post-process, write]
    FileRole:
      type: string
      enum: [main, block, companion]
    OutputMode:
      type: string
      enum: [overwrite, once, regions, pair, block, copy]
    FileChangeKind:
      description: >-
        What Apply does to a file. `added`, `modified` and `deleted` are written or removed. `unchanged` (rendered, identical to the
        disk), `not-rendered` (plans only: its unit was skipped because nothing it read changed; listed from the unit's stored state)
        and `kept` (a `once` file or companion that exists: the team's, never overwritten) are left alone. `hand-edited`, `conflict`
        and `orphaned-owned` follow the hand-edit policy and the owned-file rule.
      type: string
      enum: [added, modified, deleted, unchanged, hand-edited, kept, orphaned-owned, conflict, not-rendered]
    PlanCounts:
      description: >-
        The number of a plan's file entries of each kind, every kind present (zero included); empty in a plan stored before counts
        (count `changes` then).
      type: object
      properties:
        added:
          type: integer
        modified:
          type: integer
        deleted:
          type: integer
        unchanged:
          type: integer
        hand-edited:
          type: integer
        kept:
          type: integer
        orphaned-owned:
          type: integer
        conflict:
          type: integer
        not-rendered:
          type: integer
      additionalProperties: false
    UnitReasonCounts:
      description: >-
        Units counted by reason, ordinal keys: `new`, `forced`, `check`, `inputs`, `outputs`, `target-missing` for rendered units,
        `unchanged` for skipped ones (`unknown` when not recorded).
      type: object
      additionalProperties:
        type: integer
