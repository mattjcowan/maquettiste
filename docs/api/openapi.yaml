      operationId: realtimeJobCompleted
      summary: 'Realtime event `job.completed` (group: job:{id})'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent once, when a job finishes (state `succeeded`, `failed` or `cancelled`). A bounded summary: read `GET /api/jobs/{id}` for the record. Report the run by `outcome`, not `state`.'
      x-realtime-group: 'job:{id}'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeJobCompleted'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  presence.changed:
    post:
      tags: [realtime]
      operationId: realtimePresenceChanged
      summary: 'Realtime event `presence.changed` (group: editors)'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a window reports its selection (PUT /api/presence), or a connection of the editors group goes away.'
      x-realtime-group: 'editors'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimePresenceChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  site.deployed:
    post:
      tags: [realtime]
      operationId: realtimeSiteDeployed
      summary: 'Realtime event `site.deployed` (group: (all, sent by the host))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a deploy, rollback or functions upload of the editor site went live; the editor reloads itself.'
      x-realtime-group: '(all, sent by the host)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeSiteDeployed'
      responses:
        '200':
          description: Not applicable; realtime events have no response.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mq_session
      description: Set by `POST /api/session`. Host-only, HttpOnly, SameSite=Strict; protected with the host's data-protection keys; carries the user name, role, issue time and a fingerprint of the editor token.
    editorToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <MAQUETTISTE_EDITOR_TOKEN>`, the secret site variable. For the CLI, scripts and tests. Compared in fixed time. In local mode a loopback or `MAQUETTISTE_LOCAL_PEERS` caller with a local `Host` and no forwarding header needs neither scheme and is the local admin (see the authentication notes in `info`).'

  parameters:
    PackName:
      name: pack
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    PackFilePath:
      name: path
      in: query
      required: true
      description: A pack-relative path with `/` separators (never a path segment).
      schema:
        type: string
    Locale:
      name: locale
      in: path
      required: true
      description: A declared BCP 47 locale other than the default.
      schema:
        type: string
        pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$'
    ProcessId:
      name: id
      in: path
      required: true
      description: A process id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JQPRC0000000000000000002
    ElementId:
      name: id
      in: path
      required: true
      description: An element or sub-element id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01J92P0V0FJ23CGSNKM7P1W5V7
    PlanId:
      name: id
      in: path
      required: true
      description: A plan id (the plan job's `planResult.plan.id`).
      schema:
        $ref: '#/components/schemas/Ulid'
    JobId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The hash the caller loaded, quoted as an ETag or bare. Missing is 428.
      schema:
        type: string
        pattern: '^(W/)?"?[0-9a-f]{64}"?$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string

  headers:
    ETag:
      description: The element's hash as a strong ETag.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IndexETag:
      description: The index's hash as a strong ETag (E5e).
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    NoCache:
      description: '`no-cache`: the client may keep the response but revalidates it with `If-None-Match` before each use (E5e).'
      schema:
        type: string
        const: no-cache

  responses:
    BadRequest:
      description: The body is not JSON or not the expected shape (`bad-request`), or is larger than 4 MB (`too-large`). The sign-in gate refuses a `POST` or `PUT` that is not `application/json` with 415 `unsupported-media-type`, and a foreign `Origin` with 403 `forbidden-origin`, before any handler runs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The request body is not valid JSON.
            status: 400
            code: bad-request
            detail: "'}' is invalid after a value. Expected either ',', '}', or ']'. LineNumber: 3 | BytePositionInLine: 2."
    Unauthenticated:
      description: No valid credential (`unauthenticated`), or a wrong token (`bad-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Sign in to use the editor.
            status: 401
            code: unauthenticated
    NotFound:
      description: No such element, diagram, plan, path in the plan, job or connection (`not-found`, `not-a-diagram`, `not-a-database`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: No element has the id 01J92P0V0FJ23CGSNKM7P1W5V9.
            status: 404
            code: not-found
    PreconditionRequired:
      description: A save or delete without `If-Match` (`precondition-required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Send the hash you loaded in If-Match.
            status: 428
            code: precondition-required
    QueueFull:
      description: Sixteen jobs are already queued (`queue-full`). Retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The job queue is full.
            status: 503
            code: queue-full
    ModelUnavailable:
      description: The model folder cannot be read (`model-unavailable`), for example a missing bind mount.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    JobFinished:
      description: The job already finished (`job-finished`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many failed sign-ins from this address (`too-many-attempts`); five per minute.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------------------------------------------------------------- scalars
    Ulid:
      description: Uppercase Crockford ULID (engine-design.md D1).
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    Hash:
      description: Lowercase hex SHA-256.
      type: string
      pattern: '^[0-9a-f]{64}$'
    RepoPath:
      description: A repo-relative path with forward slashes.
      type: string

    # ---------------------------------------------------------------- errors, session, health
    Problem:
      description: RFC 9457 problem details (`application/problem+json`), from `Results.Problem`. `code` is stable; `title` and `detail` are for people.
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad-request
            - unsupported-media-type
            - too-large
            - unauthenticated
            - bad-token
            - too-many-attempts
            - forbidden
            - forbidden-origin
            - not-found
            - not-a-diagram
            - not-a-database
            - invalid-icon
            - precondition-required
            - queue-full
            - job-finished
            - model-unavailable
            - superseded
            - conflict
            - internal
        traceId:
          type: string
    SignInRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
        returnUrl:
          type: string
          description: Form posts only; a local path to redirect to.
    SessionUser:
      type: object
      required: [name, displayName, role]
      properties:
        name:
          type: string
          description: The name realtime presence and PublishToUserAsync use.
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [viewer, editor, maintainer, admin]
    SessionInfo:
      type: object
      required: [user, via, mode]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        via:
          type: string
          enum: [local, token, cookie]
        mode:
          type: string
          enum: [local, hosted]
    EditorHealth:
      type: object
      required: [status, engineVersion, engineBuild, modelLoaded, elements, worker, watcher]
      properties:
        status:
          type: string
          enum: [ok, starting, degraded]
          description: '`starting` until the first load finished; `degraded` when the model folder is unreadable or a background service keeps failing.'
        engineVersion:
          type: string
          description: '`EngineVersion.Value`, the engine''s format-level version.'
        engineBuild:
          type: string
          description: The loaded engine assembly's informational version without any `+` suffix; in the image, the per-build package version of `/opt/maquettiste/engine.version` (`phase2-design.md` PD24), so an upgrade check can see which engine the functions compiled against.
        modelLoaded:
          type: boolean
        elements:
          type: integer
        worker:
          type: string
          enum: [running, stopped]
        watcher:
          type: string
          enum: [watching, polling, stopped]
          description: '`polling` when the file watcher failed and only the periodic rescan runs.'

    # ---------------------------------------------------------------- project
    ProjectInfo:
      description: Composed by the functions from the snapshot, the pack list (E2) and git.
      type: object
      required: [name, formatVersion, engineVersion, mode, settings, settingsHash, databases, packs, packDiagnostics, extensions, git]
      properties:
        name:
          type: string
          description: '`settings.name`, else the repo folder name.'
        formatVersion:
          type: integer
        engineVersion:
          type: string
        mode:
          type: string
          enum: [local, hosted]
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        settingsHash:
          $ref: '#/components/schemas/Hash'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/ElementSummary'
        packs:
          type: array
          description: Every pack under `.maquettiste/templates/`, enabled or not (`settings.packs` says which run).
          items:
            $ref: '#/components/schemas/PackManifest'
        packDiagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        extensions:
          type: array
          description: Extension schemas; the inspector renders custom properties from them.
          items:
            $ref: '#/components/schemas/ExtensionSchema'
        git:
          description: Read-only status for the top bar; `null` when the repo is not a git checkout or git is unavailable.
          oneOf:
            - $ref: '#/components/schemas/GitSummary'
            - type: 'null'
        iconHash:
          description: The content hash of the icon `GET /api/project/branding/icon` serves (use it to refresh the icon), or null without a usable one. An older server leaves it out.
          type: [string, 'null']
        projectKey:
          description: A stable identity of the checkout the host serves (the first 16 hex digits of the SHA-256 of its full root path), so the editor keeps per-project browser state (page state) apart for two projects with one name and across a rename. Not a secret and not a path. An older server leaves it out (the editor then keys by `name`); null from the MCP `get_project` tool, which serves no editor.
          type: [string, 'null']
          pattern: '^[0-9a-f]{16}$'
    GitSummary:
      type: object
      required: [branch, head, changedModelFiles]
      properties:
        branch:
          type: [string, 'null']
          description: '`null` on a detached head.'
        head:
          type: [string, 'null']
        changedModelFiles:
          type: integer
          description: Files under `.maquettiste/` that `git status --porcelain` lists.
    SettingsDocument:
      x-engine-addition: E3
      x-engine-record: Maquettiste.Engine.SettingsDocument
      type: object
      required: [settings, path, hash, json]
      properties:
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        path:
          $ref: '#/components/schemas/RepoPath'
        hash:
          $ref: '#/components/schemas/Hash'
        json:
          $ref: '../../schemas/v1/maquettiste.json'
    SettingsSaveResult:
      x-engine-addition: E3
      x-engine-record: Maquettiste.Engine.SettingsSaveResult
