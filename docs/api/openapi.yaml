        name:
          type: string
        change:
          type: string
          enum: [added, removed, changed]
        path:
          type: string
          description: The model-relative path on the `to` side (`from` for a removed element).
        previousName:
          type: string
          description: The name on the `from` side, when it was renamed.
        previousPath:
          type: string
          description: The path on the `from` side, when the file moved.
        package:
          type: string
          description: >-
            Grouped by package only: the package the document states (a package's own row carries its `parent`), on
            the `to` side, or the `from` side for a removed element. Left out for none.
        database:
          type: string
          description: Grouped by package, a migration fact only; the database the fact belongs to.
        label:
          type: string
          description: >-
            Grouped by package, a migration fact only (it has no name): its `fact`, then its object's kind and names as
            the fact records them, such as `rename column billing.invoices.number`.
        fields:
          type: array
          maxItems: 50
          description: With field changes, a changed element only; its field changes, each naming its sub-element.
          items:
            $ref: '#/components/schemas/SnapshotFieldChange'
        fieldsTruncated:
          type: boolean
          description: Written only when true; more fields differ than `fields` lists.
    SnapshotPackageChanges:
      x-engine-record: Maquettiste.Engine.SnapshotPackageChanges
