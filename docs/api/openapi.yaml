        outputTokens:
          type: integer
        usedToday:
          type: integer
        limited:
          description: Why the model was made to answer in text, when it was (the turn cap or the request's token budget).
          type: [string, 'null']
          enum: [turns, budget, null]
    AssistErrorEvent:
      description: |
        The answer failed: `tools-unsupported` (the site's model does not support tools; choose another in the host's AI
        settings), `max-tokens` (the model ran out of output tokens part way through its tool calls), `provider` (the
        provider refused or failed; `message` says how), `not-configured`, `budget-exhausted` or `internal`.
      type: object
      required: [type, code, message]
      properties:
        type:
          const: error
        code:
          type: string
          enum: [tools-unsupported, max-tokens, provider, not-configured, budget-exhausted, internal]
        message:
          type: string
    AssistEntry:
      description: One entry of a stored conversation, as the panel shows it.
      oneOf:
        - type: object
          required: [type, text, context]
          properties:
            type:
              const: user
            text:
              type: string
            context:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/AssistContext'
        - type: object
          required: [type, text]
          properties:
            type:
              const: assistant
            text:
              type: string
        - type: object
          required: [type, id, name, arguments, isError, summary]
          properties:
            type:
              const: tool
            id:
              type: string
            name:
              type: string
            arguments: {}
            isError:
              type: boolean
            summary:
              type: string
        - type: object
          required: [type, proposal]
          properties:
            type:
              const: proposal
            proposal:
              $ref: '#/components/schemas/AssistProposal'
        - type: object
          required: [type, code, message]
          properties:
            type:
              const: error
            code:
              type: string
            message:
              type: string
    AssistConversationSummary:
      type: object
      required: [id, title, createdUtc, updatedUtc, entryCount]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        title:
          type: string
        createdUtc:
          type: string
          format: date-time
        updatedUtc:
          type: string
          format: date-time
        entryCount:
          type: integer
    AssistConversationList:
