                $ref: '#/components/schemas/ExtensionWriteResult'
        '409':
          description: The file changed since it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '404':
          description: No such file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/extensions/file/move:
    post:
      tags: [extensions]
      operationId: moveExtensionFile
      summary: Rename one extension file within its kind
      description: |
        `If-Match` carries the source file's hash. The target must not exist and must be of the same kind (a schema stays a
        `<name>.json`, a rule a `rules/<name>.js`), else 422. Nothing refers to an extension file by its path, so nothing else changes.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: ModelStore.MoveExtensionFileAsync(move, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionFileMove'
      responses:
        '200':
          description: Moved; the ETag is the moved file's hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '409':
          description: The source changed since it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '422':
          description: The target exists or is of another kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '404':
          description: No such source file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/outputs:
    parameters:
      - $ref: '#/components/parameters/PackName'
    get:
      tags: [packs]
      operationId: getPackOutputs
      summary: The files a pack's manifest records
      description: Every manifest entry of the pack with its unit, element, root, mode and state on disk (`intact`, `edited`, `missing`; for a `block` output, the state of its lines in the file), and when the manifest was last written.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPackOutputsAsync(pack)
      responses:
        '200':
          description: The outputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackOutputs'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/plan/{id}/unit:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [generation]
      operationId: getPlanUnit
      summary: One unit of a plan with its reason, causes and grouped read keys
      description: '"Why not" for a skipped unit (generation-ui.md section 4.3): its recorded read keys grouped by cause kind and a one-sentence summary. The unit key travels as the `key` query parameter since it holds `/` and `:`.'
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPlanUnitAsync(planId, key)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanUnitDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/explain:
    post:
      tags: [generation]
      operationId: explainUnit
      summary: Why a unit does or does not render an element
      description: |
        The first reason that applies (generation-ui.md section 4.3): `pack-invalid`, `unknown-unit`, `pack-disabled`,
        `unknown-element`, `scope`, `selector`, `skip-hint`, `filter`; or, when the unit plans the element, the plan's reason
        and causes, from `planId` when that plan holds the unit, else from a new dry-run plan of the pack (which is stored like
        any plan and named by `planId` in the answer). Works for elements no plan contains.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ExplainAsync(pack, unit, elementId, planId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/presence:
    put:
      tags: [presence]
      operationId: reportPresence
      summary: Report this window's selection
      description: Stores the selection of one realtime connection that belongs to the caller and publishes `presence.changed` to `editors`. Idempotent; the editor sends it when the selection or workspace changes (debounced 250 ms) and after every reconnect.
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (functions state and IRealtime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceReport'
            example:
              connectionId: kP3v0lXq9Wm2Zs8TnB1c4A
              elementId: 01J92P0V0FJ23CGSNKM7P1W5V7
              workspace: entities
      responses:
        '204':
          description: Recorded.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'


webhooks:
  model.changed:
    post:
      tags: [realtime]
      operationId: realtimeModelChanged
      summary: 'Realtime event `model.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after every save, create, delete or batch, and after the file watcher or the periodic rescan indexes a change on disk.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeModelChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  validation.completed:
    post:
      tags: [realtime]
      operationId: realtimeValidationCompleted
      summary: 'Realtime event `validation.completed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after a whole-model validation that follows one or more model.changed or project.changed events (debounced 750 ms).'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeValidationCompleted'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  project.changed:
    post:
      tags: [realtime]
      operationId: realtimeProjectChanged
      summary: 'Realtime event `project.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent when maquettiste.json, a pack or an extension schema changed (a settings save or a disk change); a validation.completed follows.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeProjectChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  templates.changed:
    post:
      tags: [realtime]
      operationId: realtimeTemplatesChanged
      summary: 'Realtime event `templates.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent once per pack whose files changed, beside project.changed (never instead of it), by the watcher and by the pack writes of this API; packs.changed follows.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTemplatesChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  packs.changed:
    post:
      tags: [realtime]
      operationId: realtimePacksChanged
      summary: 'Realtime event `packs.changed` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Names the packs of the templates.changed events just sent.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimePacksChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  jobs.cleared:
    post:
      tags: [realtime]
      operationId: realtimeJobsCleared
      summary: 'Realtime event `jobs.cleared` (group: (all))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent after `DELETE /api/jobs` cleared the run history; read `GET /api/jobs` again.'
      x-realtime-group: '(all)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobHistoryCleared'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  job.progress:
    post:
      tags: [realtime]
      operationId: realtimeJobProgress
      summary: 'Realtime event `job.progress` (group: job:{id})'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent while a job runs, at most four per second per job.'
      x-realtime-group: 'job:{id}'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeJobProgress'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  job.completed:
    post:
      tags: [realtime]
      operationId: realtimeJobCompleted
      summary: 'Realtime event `job.completed` (group: job:{id})'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent once, when a job finishes (state `succeeded`, `failed` or `cancelled`). A bounded summary: read `GET /api/jobs/{id}` for the record. Report the run by `outcome`, not `state`.'
      x-realtime-group: 'job:{id}'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeJobCompleted'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  presence.changed:
    post:
      tags: [realtime]
      operationId: realtimePresenceChanged
      summary: 'Realtime event `presence.changed` (group: editors)'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a window reports its selection (PUT /api/presence), or a connection of the editors group goes away.'
      x-realtime-group: 'editors'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimePresenceChanged'
      responses:
        '200':
          description: Not applicable; realtime events have no response.
  site.deployed:
    post:
      tags: [realtime]
      operationId: realtimeSiteDeployed
      summary: 'Realtime event `site.deployed` (group: (all, sent by the host))'
      description: 'Delivered over the host hub `/_host/realtime`, not as an HTTP request. Sent a deploy, rollback or functions upload of the editor site went live; the editor reloads itself.'
      x-realtime-group: '(all, sent by the host)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeSiteDeployed'
      responses:
        '200':
          description: Not applicable; realtime events have no response.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mq_session
      description: Set by `POST /api/session`. Host-only, HttpOnly, SameSite=Strict; protected with the host's data-protection keys; carries the user name, role, issue time and a fingerprint of the editor token.
    editorToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <MAQUETTISTE_EDITOR_TOKEN>`, the secret site variable. For the CLI, scripts and tests. Compared in fixed time. In local mode a loopback or `MAQUETTISTE_LOCAL_PEERS` caller with a local `Host` and no forwarding header needs neither scheme and is the local admin (see the authentication notes in `info`).'

  parameters:
    PackName:
      name: pack
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    ExtensionFilePath:
      name: path
      in: query
      required: true
      description: A path under the model's `extensions/` folder, `<name>.json` or `rules/<name>.js`.
      schema:
        type: string
    PackFilePath:
      name: path
      in: query
      required: true
      description: A pack-relative path with `/` separators (never a path segment).
      schema:
        type: string
    Locale:
      name: locale
      in: path
      required: true
      description: A declared BCP 47 locale other than the default.
      schema:
        type: string
        pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$'
    ProcessId:
      name: id
      in: path
      required: true
      description: A process id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JQPRC0000000000000000002
    ElementId:
      name: id
      in: path
      required: true
      description: An element or sub-element id (uppercase ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01J92P0V0FJ23CGSNKM7P1W5V7
    PlanId:
      name: id
      in: path
      required: true
      description: A plan id (the plan job's `planResult.plan.id`).
      schema:
        $ref: '#/components/schemas/Ulid'
    JobId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The hash the caller loaded, quoted as an ETag or bare. Missing is 428.
      schema:
        type: string
        pattern: '^(W/)?"?[0-9a-f]{64}"?$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    FilterKind:
      name: kind
      in: query
      description: Only this kind.
      schema:
        $ref: '#/components/schemas/ElementKind'
    FilterPackage:
      name: package
      in: query
      description: Only elements directly in this package, by package id or package name (ignoring case).
      schema:
        type: string
    FilterTag:
      name: tag
      in: query
      description: Only elements with this tag key.
      schema:
        type: string
    FilterCategory:
      name: category
      in: query
      description: Only elements in this category (its id).
      schema:
        type: string
    FilterStereotype:
      name: stereotype
      in: query
      description: Only elements with this stereotype key.
      schema:
        type: string
    FilterQuery:
      name: query
      in: query
      description: Only elements whose name contains this text, ignoring case.
      schema:
        type: string
    PageCursor:
      name: cursor
      in: query
      description: The `next` of the previous page, as it was returned (opaque; it encodes the last position read).
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: The page size, 1 to 1000; 100 when absent. Out of range is `bad-request`.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  headers:
    ETag:
      description: The element's hash as a strong ETag.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
      example: '"4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73"'
    IndexETag:
      description: The index's hash as a strong ETag (E5e).
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    NoCache:
      description: '`no-cache`: the client may keep the response but revalidates it with `If-None-Match` before each use (E5e).'
      schema:
        type: string
        const: no-cache

    NextLink:
      description: 'While more rows follow a paged answer: `<url>; rel="next"`, the same request with `cursor` set to the next page''s.'
      schema:
        type: string
      example: '</api/model/index?kind=entity&limit=100&cursor=cDEAZW50aXR5AEludm9pY2UAMDFKOTJQMFYwRkoyM0NHU05LTTdQMVc1Vjc>; rel="next"'

  responses:
    BadRequest:
      description: The body is not JSON or not the expected shape (`bad-request`), or is larger than 4 MB (`too-large`). The sign-in gate refuses a `POST` or `PUT` that is not `application/json` with 415 `unsupported-media-type`, and a foreign `Origin` with 403 `forbidden-origin`, before any handler runs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The request body is not valid JSON.
            status: 400
            code: bad-request
            detail: "'}' is invalid after a value. Expected either ',', '}', or ']'. LineNumber: 3 | BytePositionInLine: 2."
    Unauthenticated:
      description: No valid credential (`unauthenticated`), or a wrong token (`bad-token`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Sign in to use the editor.
            status: 401
            code: unauthenticated
    NotFound:
      description: No such element, diagram, plan, path in the plan, job or connection (`not-found`, `not-a-diagram`, `not-a-database`, `not-a-query`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: No element has the id 01J92P0V0FJ23CGSNKM7P1W5V9.
            status: 404
            code: not-found
    PreconditionRequired:
      description: A save or delete without `If-Match` (`precondition-required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Send the hash you loaded in If-Match.
            status: 428
            code: precondition-required
    QueueFull:
      description: Sixteen jobs are already queued (`queue-full`). Retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: The job queue is full.
            status: 503
            code: queue-full
    ModelUnavailable:
      description: The model folder cannot be read (`model-unavailable`), for example a missing bind mount.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    JobFinished:
      description: The job already finished (`job-finished`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many failed sign-ins from this address (`too-many-attempts`); five per minute.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------------------------------------------------------------- scalars
    Ulid:
      description: Uppercase Crockford ULID (engine-design.md D1).
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    Hash:
      description: Lowercase hex SHA-256.
      type: string
      pattern: '^[0-9a-f]{64}$'
    RepoPath:
      description: A repo-relative path with forward slashes.
      type: string

    # ---------------------------------------------------------------- errors, session, health
    Problem:
      description: RFC 9457 problem details (`application/problem+json`), from `Results.Problem`. `code` is stable; `title` and `detail` are for people.
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad-request
            - unsupported-media-type
            - too-large
            - unauthenticated
            - bad-token
            - too-many-attempts
            - forbidden
            - forbidden-origin
            - not-found
            - not-a-diagram
            - not-a-database
            - not-a-query
            - invalid-icon
            - precondition-required
            - queue-full
            - job-finished
            - model-unavailable
            - superseded
            - conflict
            - internal
        traceId:
          type: string
    SignInRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
        returnUrl:
          type: string
          description: Form posts only; a local path to redirect to.
    SessionUser:
      type: object
      required: [name, displayName, role]
      properties:
        name:
          type: string
          description: The name realtime presence and PublishToUserAsync use.
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [viewer, editor, maintainer, admin]
    SessionInfo:
      type: object
      required: [user, via, mode]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        via:
          type: string
          enum: [local, token, cookie]
        mode:
          type: string
          enum: [local, hosted]
    EditorHealth:
      type: object
      required: [status, productVersion, build, engineVersion, engineBuild, modelLoaded, elements, worker, watcher]
      properties:
        status:
          type: string
          enum: [ok, starting, degraded]
          description: '`starting` until the first load finished; `degraded` when the model folder is unreadable or a background service keeps failing.'
        productVersion:
          type: string
          description: 'The release running (`EngineVersion.Product`), such as `0.5.3`: the version `maquettiste --version` prints first and the image''s `org.opencontainers.image.version` label. Compare this one to know which release answers.'
        build:
          type: string
          description: 'The build of that release (`EngineVersion.Build`): `productVersion` locally; in the image, the per-build package version of `/opt/maquettiste/engine.version`, such as `0.5.3-b14a8131cfe39`.'
        engineVersion:
          type: string
          description: '`EngineVersion.Value`, the engine contract version that packs'' `engine` ranges are checked against. It is not the release: see `productVersion`.'
        engineBuild:
          type: string
          description: The loaded engine assembly's informational version without any `+` suffix (the same value as `build`); in the image, the per-build package version of `/opt/maquettiste/engine.version` (`phase2-design.md` PD24), so an upgrade check can see which engine the functions compiled against.
        modelLoaded:
          type: boolean
        elements:
          type: integer
        worker:
          type: string
          enum: [running, stopped]
        watcher:
          type: string
          enum: [watching, polling, stopped]
          description: '`polling` when the file watcher failed and only the periodic rescan runs.'

    # ---------------------------------------------------------------- project
    ProjectInfo:
      description: Composed by the functions from the snapshot, the pack list (E2) and git.
      type: object
      required: [name, formatVersion, engineVersion, productVersion, build, workspace, branch, worktree, repository, mode, settings, settingsHash, databases, packs, packDiagnostics, extensions, git]
      properties:
        name:
          type: string
          description: '`settings.name`, else the repo folder name.'
        formatVersion:
          type: integer
        engineVersion:
          type: string
          description: 'The engine contract version (`EngineVersion.Value`) that packs'' `engine` ranges are checked against; not the release (see `productVersion`).'
        productVersion:
          type: string
          description: 'The release running (`EngineVersion.Product`), such as `0.5.3`; the same as `GET /api/health` `productVersion`.'
        build:
          type: string
          description: 'The build of that release (`EngineVersion.Build`); in the image, the content of `/opt/maquettiste/engine.version`.'
        workspace:
          type: [string, 'null']
          description: 'What the served checkout is called, shown in the top bar beside the release: the `MAQUETTISTE_WORKSPACE` variable (trimmed) when set, else `branch`, else the short commit of a detached head, else `worktree`; null when none is known. Read from `.git` on each request, without running git.'
