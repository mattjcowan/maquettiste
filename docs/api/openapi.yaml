  /api/validate:
    post:
      tags: [validation]
      operationId: validate
      summary: Validate the whole model or a scope
      description: >-
        An empty body or `{}` validates everything. Load diagnostics (files that failed to parse) are included, and so are the
        resolver's findings once the whole model validates without error (the resolved MQ4005 of a foreign key column whose type
        an overlay pins, MQ4001, MQ4008, MQ4009, MQ4011; computed once per model version), scoped like the load diagnostics, so a
        validation reports what generation would. With `against`, the whole model is also compared with a model snapshot.
      x-maquettiste-role: viewer
      x-maquettiste-engine: ModelStore.ValidateAsync(scope)
      parameters:
        - $ref: '#/components/parameters/SnapshotQuery'
        - name: against
          in: query
          required: false
          description: >-
            A model snapshot id to compare the whole model with (`ModelStore.ValidateAgainstAsync`): a change since the snapshot
            that a migration must follow (a rename or moved key, a type change that is not a widening, a dropped table, column or
            sequence, a column made not null) and that no migration fact the snapshot lacks explains is MQ4102; a fact whose
            combined effect the model no longer shows is MQ4103; snapshot objects whose owners have errors are skipped with
            MQ4109. This host compares with snapshots only: a folder, an id that names no snapshot, or a body with `elementIds`
            is 400 `bad-request`.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationScope'
            example:
              elementIds: [01J92P0V0HEGSC6MW92CST5KA6]
              includeReferrers: true
              includeScriptRules: true
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The report (never truncated over HTTP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
              examples:
                error:
                  summary: Payment with its key removed
                  value:
                    diagnostics:
                    - rule: MQ3005
                      severity: error
                      message: Entity 'Payment' has no key; add 'key', or make it abstract or derived.
                      elementId: 01J92P0V0HEGSC6MW92CST5KA6
                      filePath: .maquettiste/model/entities/payment.json
                      jsonPointer: ''
                      line: 1
                      column: 1
                    errors: 1
                    warnings: 0
                    infos: 0
                    truncated: false
                    hasErrors: true
                    suppressed: []
                clean:
                  summary: The billing fixture
                  value:
                    diagnostics: []
                    errors: 0
                    warnings: 0
                    infos: 0
                    truncated: false
                    hasErrors: false
                    suppressed: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

