  /api/templates/preview:
    post:
      tags: [templates]
      operationId: previewTemplate
      summary: Render one unit against one element, with no writes
      description: |
        The Database workspace's DDL preview calls `sql-ddl`/`table` with a resolved table key (`<entityId>@<databaseId>`
        for a synthesized entity table, a table file's id for a designed one) and `sql-ddl`/`schema` with a database id.
        The unit renders even when its `where` filter would not plan it. A model with errors returns the errors and no
        files. An element outside the unit's scope (another kind than its `each`, one its selector does not return, an
        element for a `model` unit, or none for an element unit) returns MQ6026 and no files, before anything renders
        (pointer `/units/<i>/for` of the pack's `pack.json`).
        With `unitOverride`, `overlay` or `parameters` the unit renders with unsaved text (generation-ui.md section 5.2): the
        pack loads even when disabled, the sandbox limits apply and the render has a deadline of `limits.scriptTimeoutMs` x 4
        (MQ6007 when it is hit). Unsaved text is code the server runs, so such a request needs the maintainer role (403 below
        it). Nothing is written.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.PreviewAsync(pack, unit, elementId, options)
      parameters:
      - name: X-Maquettiste-Client
        in: header
        required: false
        description: |
          The caller's live-preview key (any opaque string, e.g. per editor tab). A newer request of this kind with the same
          value cancels one still in flight on the server (409 `superseded`); without it nothing is superseded.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
            example:
              pack: sql-ddl
              unit: table
              elementId: 01J92P0V0ETQKXXP951CMMNHH3@01J92P0V1QRN2181XM2ZWE02W4
      responses:
        '200':
          description: The rendered files and diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResult'
              examples:
                table:
                  summary: DDL of the customers table
                  value:
                    files:
                    - path: db/main/billing/tables/customers.sql
                      text: "-- Generated by Maquettiste (sql-ddl/table). Do not edit; changes are overwritten.\n-- Table billing.customers of database main (PostgreSQL 16).\n-- Maps entity Customer.\n\nCREATE TABLE billing.customers (\n    id uuid NOT NULL,\n    name varchar(120) NOT NULL,\n    email varchar(254) NOT NULL,\n    customer_since date NULL,\n    created_at timestamptz(6) NOT NULL,\n    updated_at timestamptz(6) NULL,\n    CONSTRAINT pk_customers PRIMARY KEY (id),\n    CONSTRAINT uq_customers_email UNIQUE (email)\n);\n"
                      role: main
                    diagnostics: []
                    readKeys:
                    - e:01J92P0V0ETQKXXP951CMMNHH3
                    - s:conventions
                    - t:sql-ddl/_table.scriban
                    - t:sql-ddl/table.scriban
                    elapsedMs: 12
                wrongElement:
                  summary: A table unit asked for an entity id
                  value:
                    files: []
                    diagnostics:
                    - rule: MQ6006
                      severity: error
                      message: The variable or function `table` was not found
                      elementId: 01J92P0V0FJ23CGSNKM7P1W5V7
                      filePath: .maquettiste/templates/sql-ddl/table.scriban
                      jsonPointer: null
                      line: 3
                      column: 13
                    readKeys: []
                    elapsedMs: 4
                outOfScope:
                  summary: An entity unit asked for a reference type
                  value:
                    files: []
                    diagnostics:
                    - rule: MQ6026
                      severity: error
                      message: This template expects an entity (unit 'entity' is 'each entity'), not 'Currency' (reference-type); pick one.
                      elementId: 01J92P0V0FJ23CGSNKM7P1W5V9
                      filePath: .maquettiste/templates/csharp-dapper/pack.json
                      jsonPointer: /units/0/for
                      line: null
                      column: null
                    readKeys: []
                    elapsedMs: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            `superseded`: a newer request of this kind with the same `X-Maquettiste-Client` cancelled this one on the server
            (one request of each kind is in flight per client key, generation-ui.md section 5.2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/templates/paths:
    post:
      tags: [templates]
      operationId: unitPaths
      summary: A unit's rendered output paths over its scope, with the count, collisions and root checks
      description: |
        Plans the unit as the planner does (its scope, then `generation.skip` hints, then its filter), or keeps only
        `elementIds`, and renders each planned element up to `limit` (default 200, at most 2000) to report its output paths.
        `count` is the whole scope. Diagnostics carry MQ6019 (the pattern cannot stay under an allowed root), MQ6020 (two
        elements of the unit render the same path), MQ6005 (paths that differ only by case), MQ6004 per refused path, and
        MQ6007 when the deadline (`limits.scriptTimeoutMs` x 4) is hit. With `unitOverride`, `overlay` or `parameters` it
        renders unsaved text, which needs the maintainer role (403 below it). Nothing is written.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.PathsAsync(pack, unit, elementIds, options, limit)
      parameters:
      - name: X-Maquettiste-Client
        in: header
        required: false
        description: |
          The caller's live-preview key (any opaque string, e.g. per editor tab). A newer request of this kind with the same
          value cancels one still in flight on the server (409 `superseded`); without it nothing is superseded.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathsRequest'
      responses:
        '200':
          description: The paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPathsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            `superseded`: a newer request of this kind with the same `X-Maquettiste-Client` cancelled this one on the server
            (one request of each kind is in flight per client key, generation-ui.md section 5.2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/templates/context:
    get:
      tags: [templates]
      operationId: getTemplateContext
      summary: Completion data for a unit's templates
      description: The globals a template of the unit sees (with `pack.params.*`), the members of the model and of the scope's records in snake_case, and the built-in helpers.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetTemplateContextAsync(pack, unit)
      parameters:
        - name: pack
          in: query
          required: true
          schema:
            type: string
        - name: unit
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateContextResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs:
    get:
      tags: [packs]
      operationId: listPacks
      summary: Every pack with its units and load diagnostics
      description: Every folder under `templates/` with a `pack.json`, enabled or not, in ordinal order. A pack whose `pack.json` does not load has `version` null, no units and its diagnostics.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ListPacksAsync()
      responses:
        '200':
          description: The packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [packs]
      operationId: createPack
      summary: Create a pack from empty or from a pack of this project
      description: '`from` is `empty` (one `each entity` unit and its template) or the name of a pack of this project, whose files are copied with the new name in `pack.json`. `pack.json` is written in canonical form. 409 when the folder exists.'
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.CreatePackAsync(name, from)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPackRequest'
      responses:
        '201':
          description: Created; `files` lists what was written and `hash` is the new `pack.json` hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: The pack folder exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: The starter is unknown; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}:
    parameters:
      - $ref: '#/components/parameters/PackName'
    get:
      tags: [packs]
      operationId: getPack
      summary: pack.json with its ETag, parameters, files and diagnostics
      description: |
        `document` is `pack.json` as written (every member, `null` when it is not JSON). `parameters` joins the defaults, the
        `parameterSchema` properties and the project values of `packs.<pack>.parameters`. `files` lists the folder with sizes,
        hashes (each file's ETag), roles and users. `diagnostics` holds the load diagnostics (MQ6001, MQ6002, MQ6021 to MQ6024),
        MQ6019 for output paths outside every root and MQ6003 / MQ6025 for templates that do not parse.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPackAsync(pack)
      responses:
        '200':
          description: The pack.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [packs]
      operationId: savePack
      summary: Save the whole pack.json document in canonical form
      description: Every member is kept (`version`, `description`, `engine`, `scripts`, `usesSchemaDiff`, `units`, `parameters`, `parameterSchema`). A schema failure (MQ6001, MQ6021) or a `name` that is not the folder is 422 and writes nothing; unit problems (MQ6019, MQ6022) are saved and reported in `diagnostics`.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.SavePackAsync(pack, document, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/v1/pack.json'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: pack.json changed since it was read; `hash` and `current` are the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: The document is invalid; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/file:
    parameters:
      - $ref: '#/components/parameters/PackName'
      - $ref: '#/components/parameters/PackFilePath'
    get:
      tags: [packs]
      operationId: getPackFile
      summary: One pack file's text with its ETag
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ReadPackFileAsync(pack, path)
      responses:
        '200':
          description: The file.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [packs]
      operationId: putPackFile
      summary: Write one pack file
      description: |
        `If-Match` with the hash read, or `If-None-Match: *` to create. The text must be UTF-8 with no NUL, at most 1 MB. A template
        that fails to parse is saved and its MQ6003 diagnostics returned (GU6). `path=pack.json` is 400: `pack.json` is saved whole
        through `PUT /api/packs/{pack}`. A path that leaves the pack folder, lexically or through a link, is 400.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.WritePackFileAsync(pack, path, text, expectedHash)
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The hash read; required unless `If-None-Match` is `*`.
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackFileWrite'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: The file changed since it was read (or exists, on create); `hash` and `current` are the disk version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: Not text, or larger than 1 MB; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [packs]
      operationId: deletePackFile
      summary: Delete one pack file
      description: Refused (409, `referenced`) while a unit names the file or a template includes it; `diagnostics` says which.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.DeletePackFileAsync(pack, path, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: The file changed since it was read, or something uses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/file/move:
    parameters:
      - $ref: '#/components/parameters/PackName'
    post:
      tags: [packs]
      operationId: movePackFile
      summary: Move one pack file, optionally rewriting the units that name it
      description: |
        `If-Match` carries the source file's hash. The target must not exist. With `updateUnits` the unit templates, companion
        templates and scripts of `pack.json` that name `from` are rewritten (canonical) in the same write, and
        `expectedPackHash` (the `pack.json` hash read) is required. 409 when either hash is stale, or (`referenced`) while a
        template includes `from`, or while a unit names it and `updateUnits` is not set.
      x-maquettiste-role: maintainer
      x-maquettiste-engine: GenerationService.MovePackFileAsync(pack, move, expectedHash)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackFileMove'
      responses:
        '200':
          description: Moved; the ETag is the moved file's hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '409':
          description: A hash is stale, or something includes or names the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '422':
          description: The target exists, or `expectedPackHash` is missing with `updateUnits`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '404':
          description: No such source file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWriteResult'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/packs/{pack}/outputs:
    parameters:
      - $ref: '#/components/parameters/PackName'
    get:
      tags: [packs]
      operationId: getPackOutputs
      summary: The files a pack's manifests record
      description: Every manifest entry of the pack (committed and built roots) with its unit, element, root, mode and state on disk (`intact`, `edited`, `missing`), and when a manifest was last written.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPackOutputsAsync(pack)
      responses:
        '200':
          description: The outputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackOutputs'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/plan/{id}/unit:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [generation]
      operationId: getPlanUnit
      summary: One unit of a plan with its reason, causes and grouped read keys
      description: '"Why not" for a skipped unit (generation-ui.md section 4.3): its recorded read keys grouped by cause kind and a one-sentence summary. The unit key travels as the `key` query parameter since it holds `/` and `:`.'
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.GetPlanUnitAsync(planId, key)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanUnitDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/generate/explain:
    post:
      tags: [generation]
      operationId: explainUnit
      summary: Why a unit does or does not render an element
      description: |
        The first reason that applies (generation-ui.md section 4.3): `pack-invalid`, `unknown-unit`, `pack-disabled`,
        `unknown-element`, `scope`, `selector`, `skip-hint`, `filter`; or, when the unit plans the element, the plan's reason
        and causes, from `planId` when that plan holds the unit, else from a new dry-run plan of the pack (which is stored like
        any plan and named by `planId` in the answer). Works for elements no plan contains.
      x-maquettiste-role: viewer
      x-maquettiste-engine: GenerationService.ExplainAsync(pack, unit, elementId, planId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/presence:
    put:
      tags: [presence]
      operationId: reportPresence
      summary: Report this window's selection
      description: Stores the selection of one realtime connection that belongs to the caller and publishes `presence.changed` to `editors`. Idempotent; the editor sends it when the selection or workspace changes (debounced 250 ms) and after every reconnect.
      x-maquettiste-role: viewer
      x-maquettiste-engine: none (functions state and IRealtime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceReport'
            example:
              connectionId: kP3v0lXq9Wm2Zs8TnB1c4A
              elementId: 01J92P0V0FJ23CGSNKM7P1W5V7
              workspace: entities
      responses:
        '204':
          description: Recorded.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'


