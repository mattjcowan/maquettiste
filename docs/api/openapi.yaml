  /api/processes/{id}/simulate:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: simulateProcess
      summary: Simulate a process (or an unsaved draft of it) through a list of inputs
      description: |
        phase-3-design.md sections 4.1 and 4.4. Simulation state lives in the client: every call replays `start` and `steps` from
        the initial entry, so one input list always gives one trace, and two windows never diverge. `document` simulates an unsaved
        draft of the process, checked as a save would check it (422 with the diagnostics when it adds an error). `scenario` runs a
        scenario's start and steps first (the request's `start` is then ignored) and `steps` after them. The replay stops after an
        input whose trace is incomplete (a guard with neither expression nor `assume`, MQ9305, MQ9507). `trace` starts at index
        `from` (-1, the default, is the initial entry).
      x-maquettiste-role: viewer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
            example:
              start:
                context:
                  01JQATT0000000000000000201: 2500
              steps:
                - event: 01JQPRX0000000000000000014
                  actor: 01JQACT0000000000000000008
              from: 0
      responses:
        '200':
          description: The traces and where the process stands after the last input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
              example:
                processHash: 4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73
                trace:
                  - index: 0
                    input: { id: input-0, input: event, event: 01JQPRX0000000000000000014, invoke: null, after: null, actor: 01JQACT0000000000000000008, signer: null, meaning: null, reason: null, payload: {}, assume: {}, expect: null, description: null }
                    accepted: true
                    refusal: null
                    microsteps:
                      - transitions: [01JQTRN0000000000000000101]
                        exited: [01JQSTA0000000000000000101]
                        entered: [01JQSTA0000000000000000102, 01JQSTA0000000000000000104, 01JQSTA0000000000000000108]
                        actions: []
                    guards: []
                    audit: []
                    configuration: [01JQSTA0000000000000000104, 01JQSTA0000000000000000108]
                    context: { 01JQATT0000000000000000201: 2500 }
                    changed: {}
                    clock: '2000-01-01T00:00:00Z'
                    final: false
                    diagnostics: []
                    incomplete: false
                configuration: [01JQSTA0000000000000000104, 01JQSTA0000000000000000108]
                context: { 01JQATT0000000000000000201: 2500 }
                enabled:
                  - trigger: invoke-done
                    event: null
                    invoke: 01JQPRX0000000000000000019
                    transitions: [01JQTRN0000000000000000105]
                    actors: []
                    guardUnknown: false
                    gate: null
                pending:
                  - invoke: 01JQPRX0000000000000000019
                    state: 01JQSTA0000000000000000104
                timers: []
                gates: []
                final: false
                clock: '2000-01-01T00:00:00Z'
                diagnostics: []
        '422':
          description: The draft `document` adds an error; nothing ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/scenarios:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: recordScenario
      summary: Record a scenario from a list of inputs
      description: |
        phase-3-design.md section 4.4. The engine replays `start` and `steps` and fills each step's `expect` (refusals recorded as
        `accepted: false`) and the `outcome` (unless the request gives one) from the replay, gives the scenario and its steps new ids,
        and saves it as one change under `model/scenarios/<process file stem>/`. `?dryRun=true` returns the scenario without writing
        it. Inputs that cannot be replayed to the last step (MQ9305, MQ9306, MQ9507) are 422 with the diagnostics.
      x-maquettiste-role: editor
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordScenarioRequest'
            example:
              name: BudgetRejected
              start:
                context:
                  01JQATT0000000000000000201: 2500
              steps:
                - event: 01JQPRX0000000000000000014
                  actor: 01JQACT0000000000000000008
                - input: invoke-error
                  invoke: 01JQPRX0000000000000000019
      responses:
        '201':
          description: The scenario was saved; `ETag` is its hash and `Location` its element.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordScenarioResult'
              example:
                id: 01JQSCN0000000000000000099
                element:
                  kind: scenario
                  id: 01JQSCN0000000000000000099
                  name: BudgetRejected
                  process: 01JQPRC0000000000000000002
                  steps: []
                hash: 4e425013f5f3873348f00f748d9c3ba2d2faa83084f705f545f9fec05cb15e73
                applied: true
                diagnostics: []
        '200':
          description: The scenario a dry run would save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordScenarioResult'
        '409':
          description: The model changed while the scenario was saved; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '422':
          description: The inputs cannot be replayed to the last step, or the scenario does not validate; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      tags: [processes]
      operationId: verifyScenarios
      summary: Replay a process's scenarios and report each one's first failure
      description: |
        phase-3-design.md sections 3 and 4.4. Every scenario of the process (or the ids or names in `scenarios`) is replayed through
        the engine interpreter; `failure` is the first failed expectation (MQ9301 to MQ9304) or the stop that kept the replay from the
        last step (MQ9305, MQ9306, MQ9507; `expected` and `actual` are then null). Results are ordered by name, then id.
      x-maquettiste-role: viewer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              scenarios: [01JQSCN0000000000000000010]
      responses:
        '200':
          description: One result per scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
              example:
                process: 01JQPRC0000000000000000002
                results:
                  - scenario: 01JQSCN0000000000000000010
                    name: BudgetRejected
                    passed: true
                    steps: 3
                    failure: null
                passed: true
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/processes/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    get:
      tags: [processes]
      operationId: exportProcess
      summary: Export a process as an XState machine config
      description: |
        phase-3-design.md section 5.1. The config in canonical key order (two-space indent, `\n` line ends, a trailing newline); what
        has no XState home travels under `meta.maquettiste`, so importing the export over the process gives the same file.
        `X-Maquettiste-Diagnostics` counts the MQ9406 notes (what went into `meta`); `X-Maquettiste-Warnings` counts the other
        diagnostics (MQ9404: a kept opaque pointer that has no place in the config and was dropped). The CLI prints those to stderr
        and the MCP tool returns every diagnostic in a second content block.
      x-maquettiste-role: viewer
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xstate]
            default: xstate
      responses:
        '200':
          description: The XState config.
          headers:
            X-Maquettiste-Diagnostics:
              description: The number of MQ9406 notes.
              schema:
                type: integer
                minimum: 0
            X-Maquettiste-Warnings:
