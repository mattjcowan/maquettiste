# Local mode (SPEC Section 4, phase2-design.md section 6.3). Run it from the repository you model, or point --project-directory at
# it; relative paths below are relative to that folder:
#
#   MAQUETTISTE_IMAGE=mattjcowan/maquettiste:dev docker compose -f <maquettiste>/docker/compose.yaml --project-directory . up -d
#
# then open http://maquettiste.localhost:8080 (no login from this machine).
# Run `maquettiste init` first (docs/user-guide.md "The command line"): without .maquettiste/, Docker creates the mount folder.
#
# NEVER delete or rename the site maquettiste.localhost in the host's management UI or API: its data folder is the bind-mounted
# .maquettiste/ below, and static-site-hosting 0.2.0 deletes a site folder recursively, model included. Recovery is
# `git checkout -- .maquettiste` (uncommitted model edits are lost).
#
# The container starts as root only to pick the user the editor runs as (docker/entrypoint.sh): the owner of .maquettiste/.
# Owned by you, as under Docker on Linux or on the Mac, it hands its /data volume to you, repairs the files an earlier run left
# owned by another user in .maquettiste/ and the output roots, and runs as you; owned by root under rootless Podman (whose root
# is you outside the container) it stays root; owned by root under Docker it runs as the owner of the repository (./). Either
# way the model and the output roots are written as you, with this file unchanged. Override with MAQUETTISTE_UID and
# MAQUETTISTE_GID (MAQUETTISTE_UID=0 stays root).
services:
  maquettiste:
    image: ${MAQUETTISTE_IMAGE:-mattjcowan/maquettiste:latest}
    user: "0:0"                                                     # picks its user at start (above)
    # MAQUETTISTE_PORT picks the host port when 8080 is taken on the machine (Windows services win over WSL forwarding).
    ports: ["127.0.0.1:${MAQUETTISTE_PORT:-8080}:8080"]
    volumes:
      - maquettiste-host:/data                                      # host config, users, keys, index cache
      - ./.maquettiste:/data/sites/maquettiste.localhost/data       # the model
      - ./:/repo                                                    # output root
    environment:
      MAQUETTISTE_REPO_ROOT: /repo
      MAQUETTISTE_UID: ${MAQUETTISTE_UID:-}                         # optional; empty = the owner of .maquettiste/
      MAQUETTISTE_GID: ${MAQUETTISTE_GID:-}                         # optional; empty = that owner's group
      MAQUETTISTE_EDITOR_TOKEN: ${MAQUETTISTE_EDITOR_TOKEN:-}       # optional; empty = local peers only
      # The container's gateway is found at start; set this only where the browser's requests arrive from another address
      # (an IP address list, never *). See docker/README.md for the Mac and other setups.
      MAQUETTISTE_LOCAL_PEERS: ${MAQUETTISTE_LOCAL_PEERS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
volumes:
  maquettiste-host:
