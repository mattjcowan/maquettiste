package: Billing
displayName: Billing and payments
description: Accounts receivable - invoices and credit notes, payments by card and bank transfer and how they settle invoices, statements, dunning, collections, refunds and disputes.

enums:
  InvoiceStatus:
    description: Lifecycle of a customer invoice.
    members:
      Draft: DRAFT | Being prepared; not yet sent.
      Issued: ISSUED | Sent to the customer.
      PartiallyPaid: PARTPAID | Some of it is paid.
      Paid: PAID | Fully paid.
      Overdue: OVERDUE | Past due with a balance.
      Void: VOID | Cancelled by a credit note.
  PaymentStatus:
    description: Processing state of a payment or refund.
    members:
      Pending: PEND | Recorded, not yet confirmed.
      Authorized: AUTH | Card authorized, not captured.
      Captured: CAPT | Funds captured.
      Settled: SETL | Funds on the bank statement.
      Failed: FAIL | Declined or returned.
      Refunded: RFND | Returned to the payer.
      Voided: VOID | Cancelled before settlement.
  CardBrand:
    description: Card network of a card payment.
    members:
      Visa: VISA | Visa.
      Mastercard: MC | Mastercard.
      AmericanExpress: AMEX | American Express.
      Discover: DISC | Discover.

entities:
  Invoice:
    description: A bill to a customer for shipped goods and charges, posted to receivables.
    stereotypes: [aggregate-root, audited]
    tags: [financial, transactional]
    attributes:
      invoiceNumber: string(20)! unique | Invoice number.
      invoiceDate: date! indexed | Invoice date.
      dueDate: date! indexed | Payment due date.
      status: InvoiceStatus! default=Draft | Lifecycle state.
      billingAddress: Address! | Bill-to address.
      subtotal: Money! | Sum of line totals.
      taxTotal: Money! | Sales tax.
      grandTotal: Money! | Amount invoiced.
      amountPaid: Money! | Payments allocated so far.
      balanceDue: Money! | Amount still owed.
      sentAt: datetimeoffset | When it was delivered to the customer.
      notes: text | Remarks printed on the invoice.
    refs:
      customer: Customer! back=invoices | Billed customer.
      salesOrder: SalesOrder back=invoices | Order invoiced.
      billingAccount: BillingAccount | Billing account used.
      currency: Currency! | Invoice currency.
      paymentTerm: PaymentTerm | Payment terms.
      journalEntry: JournalEntry | Posting in the ledger.
    children:
      lines: InvoiceLine ordered | Invoiced lines.
    overlay:
      description: The due date cannot precede the invoice date; open invoices are listed by due date.
      checks:
        ck_invoices_due_after_invoice_date: due_date >= invoice_date
      indexes:
        - name: ix_invoices_open_by_due_date
          columns: [dueDate]
          where: status <> 'PAID'

  InvoiceLine:
    description: A line of an invoice - a shipped product or a charge.
    tags: [financial, high-volume]
    key: ulid
    attributes:
      lineNumber: int32! min=1 | Line number.
      description: string(300)! | Line text.
      quantity: decimal(12,3)! | Quantity invoiced.
      unitPrice: Money! | Price per unit.
      discount: Percentage | Discount.
      taxRate: Percentage | Tax rate.
      lineTotal: Money! | Line total.
    refs:
      product: Product | Product invoiced.
      salesOrderLine: SalesOrderLine | Order line invoiced.
      shipmentLine: ShipmentLine | Shipment line invoiced.
      revenueAccount: LedgerAccount | Revenue account credited.

  CreditNote:
    description: A document reducing what a customer owes, after a return, a price correction or a goodwill gesture.
    stereotypes: [aggregate-root, audited]
    tags: [financial]
    attributes:
      creditNoteNumber: string(20)! unique | Credit note number.
      issuedOn: date! | Issue date.
      reason: string(200)! | Why the credit was given.
      totalAmount: Money! | Credit amount.
      status: string(20)! default=open | open, applied or refunded.
    refs:
      customer: Customer! back=creditNotes | Credited customer.
      invoice: Invoice | Invoice corrected.
      returnAuthorization: ReturnAuthorization | Return credited.
    children:
      lines: CreditNoteLine | Credited items.

  CreditNoteLine:
    description: A credited item of a credit note.
    attributes:
      description: string(300)! | Line text.
      quantity: decimal(12,3)! | Quantity credited.
      unitPrice: Money! | Price per unit.
      lineTotal: Money! | Line total.
    refs:
      invoiceLine: InvoiceLine | Invoice line credited.
      product: Product | Product credited.

  Payment:
    description: Money received from a customer. Card payments and bank transfers extend it in their own tables (TPT); checks and cash use the base table only.
    stereotypes: [aggregate-root, audited]
    tags: [financial, transactional]
    attributes:
      paymentNumber: string(20)! unique | Payment number.
      receivedAt: datetimeoffset! | When the payment was received.
      amount: Money! | Amount received.
      unappliedAmount: Money | Amount not yet allocated to invoices.
      status: PaymentStatus! default=Pending | Processing state.
      reference: string(64) | Payer's reference, such as a check number.
    refs:
      customer: Customer! back=payments | Paying customer.
      paymentBatch: PaymentBatch | Batch the payment was deposited in.
      depositAccount: BankAccount | Account the money went to.
      journalEntry: JournalEntry | Posting in the ledger.
    mapping:
      description: Card payments and bank transfers each get their own table keyed by the payment id (table per type).
      inheritance: tpt

  CardPayment:
    description: A payment by credit or purchasing card through the payment processor.
    base: Payment
    tags: [pii]
    attributes:
      cardBrand: CardBrand! | Card network.
      last4: string(4)! | Last four digits of the card.
      expiryMonth: int16 min=1 max=12 | Card expiry month.
      expiryYear: int16 min=2000 | Card expiry year.
      authorizationCode: string(20) | Issuer's authorization code.
      processorReference: string(64) indexed | Processor transaction id.
    refs:
      storedPaymentMethod: StoredPaymentMethod | Saved card used.

  BankTransfer:
    description: A payment by ACH, wire or SEPA transfer, identified on the bank statement.
    base: Payment
    attributes:
      transferReference: string(64)! | Reference on the bank statement.
      payerBankName: string(100) | Payer's bank.
      payerAccountLast4: string(4) | Last digits of the payer's account.
      valueDate: date | Date the funds became available.

  StoredPaymentMethod:
    description: A tokenized card or bank account a customer saved on the portal; the details stay with the processor.
    stereotypes: [audited, soft-delete]
    tags: [pii]
    attributes:
      methodType: string(20)! | card or bank-account.
      cardBrand: CardBrand | Card network, for cards.
      last4: string(4)! | Last four digits.
      expiresOn: date | Expiry, for cards.
      processorToken: string(128)! secret | Token issued by the processor.
      isDefault: bool! default=false | Used for automatic payments.
    refs:
      customer: Customer! cascade back=paymentMethods | Customer that saved it.

  PaymentTerm:
    description: Payment terms, such as Net 30 or 2/10 Net 30.
    stereotypes: [lookup]
    tags: [configuration, financial]
    key: identity32
    attributes:
      netDays: int16! min=0 | Days until the invoice is due.
      discountDays: int16 min=0 | Days within which the early payment discount applies.
      discountPercent: Percentage | Early payment discount.

  BillingAccount:
    description: How and where a customer wants to be invoiced; large customers have one per division.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      accountNumber: string(20)! unique | Billing account number.
      name: string(120)! | Account name, such as Facilities division.
      billingAddress: Address! | Where invoices go.
      invoiceDeliveryMethod: string(20)! default=email | email, portal, edi or mail.
      invoiceEmail: EmailAddress | Mailbox for invoices.
      consolidateInvoices: bool! default=false | Whether to send one monthly invoice.
    refs:
      customer: Customer! cascade back=billingAccounts | Customer billed.
      currency: Currency | Invoice currency.

  CustomerStatement:
    description: A periodic statement of a customer's open items and balance.
    tags: [financial]
    attributes:
      statementDate: date! | Statement date.
      openingBalance: Money! | Balance at the start of the period.
      closingBalance: Money! | Balance at the statement date.
      sentAt: datetimeoffset | When it was sent.
      documentUrl: string(400) | Rendered PDF.
    refs:
      customer: Customer! back=statements | Customer.
      billingAccount: BillingAccount | Billing account.

  DunningNotice:
    description: A payment reminder for an overdue invoice, escalating by level.
    tags: [financial]
    attributes:
      level: int16! min=1 max=4 | Escalation level.
      issuedOn: date! | Date sent.
      amountOverdue: Money! | Amount overdue.
      feeAmount: Money | Reminder fee charged.
      sentVia: string(20) | email or mail.
    refs:
      invoice: Invoice! cascade back=dunningNotices | Overdue invoice.
      collectionCase: CollectionCase | Collection case it belongs to.

  WriteOff:
    description: A bad debt write-off of an uncollectable invoice balance.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      writtenOffOn: date! | Date written off.
      amount: Money! | Amount written off.
      reason: string(300)! | Why it is uncollectable.
    refs:
      invoice: Invoice! | Invoice written off.
      approvedBy: Employee | Controller who approved it.
      journalEntry: JournalEntry | Posting in the ledger.

  Refund:
    description: Money returned to a customer, from an overpayment or a credit note.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      refundNumber: string(20)! unique | Refund number.
      refundedAt: datetimeoffset | When it was paid out.
      amount: Money! | Amount refunded.
      method: string(20)! | card, ach or check.
      status: PaymentStatus! default=Pending | Processing state.
      reference: string(64) | Processor or bank reference.
    refs:
      customer: Customer! | Customer refunded.
      payment: Payment | Payment refunded.
      creditNote: CreditNote | Credit note paid out.

  PaymentBatch:
    description: A group of payments deposited together, such as a lockbox file or a card settlement.
    stereotypes: [audited]
    tags: [financial, integration]
    pluralName: Payment batches
    attributes:
      batchNumber: string(20)! unique | Batch number.
      batchDate: date! | Deposit date.
      source: string(20)! | lockbox, ach-file or card-settlement.
      itemCount: int32! min=0 | Payments in the batch.
      totalAmount: Money! | Batch total.
      isPosted: bool! default=false | Whether it was posted to the ledger.
    refs:
      bankAccount: BankAccount! | Account deposited to.

  Dispute:
    description: A chargeback or dispute raised by a cardholder's bank against a card payment.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      disputeNumber: string(20)! unique | Dispute number from the processor.
      openedOn: date! | Date opened.
      reasonCode: string(20)! | Network reason code.
      amount: Money! | Disputed amount.
      status: string(20)! default=open | open, evidence-submitted, won or lost.
      resolvedOn: date | Date resolved.
      resolution: text | Outcome notes.
    refs:
      cardPayment: CardPayment! | Disputed payment.
      invoice: Invoice | Invoice paid by the payment.

  BankAccount:
    description: A Northwind bank account that receives customer payments.
    stereotypes: [audited]
    tags: [financial, master-data]
    attributes:
      name: string(100)! unique | Account name, such as Operating account USD.
      bankName: string(100)! | Bank.
      accountNumberMasked: string(20)! | Masked account number.
      iban: string(34) secret | IBAN, for euro accounts.
      routingNumber: string(9) | ABA routing number, for US accounts.
    refs:
      currency: Currency! | Account currency.
      ledgerAccount: LedgerAccount! | Cash account in the ledger.

  RemittanceAdvice:
    description: A customer's remittance advice explaining which invoices a payment covers, from EDI 820 or email.
    tags: [integration]
    attributes:
      receivedOn: date! | Date received.
      payerReference: string(64) | Payer's reference.
      totalAmount: Money! | Amount remitted.
      rawDocument: json | Original document, as JSON.
      isMatched: bool! default=false | Whether it was matched to a payment.
    refs:
      customer: Customer | Remitting customer.
      payment: Payment | Matched payment.

  LateFee:
    description: A finance charge assessed on an overdue invoice.
    tags: [financial]
    attributes:
      assessedOn: date! | Date assessed.
      amount: Money! | Fee amount.
      rate: Percentage | Monthly rate applied.
      isWaived: bool! default=false | Whether it was waived.
      waivedReason: string(200) | Why it was waived.
    refs:
      invoice: Invoice! cascade back=lateFees | Overdue invoice.

  CollectionCase:
    description: A collection effort on a customer's overdue balance, possibly handed to an agency.
    stereotypes: [aggregate-root, audited]
    tags: [financial]
    attributes:
      caseNumber: string(20)! unique | Case number.
      openedOn: date! | Date opened.
      status: string(20)! default=open | open, promise-to-pay, agency or closed.
      totalOverdue: Money! | Overdue balance when opened.
      agencyName: string(120) | Collection agency, when outsourced.
      closedOn: date | Date closed.
      notes: text | Case notes.
    refs:
      customer: Customer! back=collectionCases | Customer in collections.
      assignedTo: Employee | Collector.

relations:
  - name: payment settles invoice
    description: How a payment is allocated to the invoices it pays; one payment can settle many invoices and one invoice can be paid in instalments.
    ends:
      - Payment payments * nav
      - Invoice invoices * nav
    attributes:
      allocatedAmount: Money! | Amount of the payment applied to the invoice.
      allocatedAt: datetimeoffset! | When the allocation was made.
      discountTaken: Money | Early payment discount taken.

diagram:
  name: Billing and payments
  description: Invoices, credits, payments and collections.
  columns: 5
