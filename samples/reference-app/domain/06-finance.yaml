package: Finance
displayName: Finance and ledger
description: The general ledger - chart of accounts, fiscal periods, journal entries, cost centers, tax rates and jurisdictions, exchange rates and budgets.

enums:
  LedgerAccountType:
    description: Classification of a ledger account in the financial statements.
    members:
      Asset: A | Resources owned, such as cash, receivables and inventory.
      Liability: L | Obligations, such as payables and tax due.
      Equity: E | Owners' equity.
      Revenue: R | Income from sales.
      Expense: X | Costs, including cost of goods sold.
  JournalEntryStatus:
    description: Posting state of a journal entry.
    members:
      Draft: D | Being prepared; does not affect balances.
      Posted: P | Posted to the ledger; immutable.
      Reversed: R | Cancelled by a reversing entry.

entities:
  LedgerAccount:
    description: An account of the chart of accounts, such as 1200 Accounts receivable, nested into summary accounts.
    stereotypes: [aggregate-root, audited]
    tags: [financial, master-data]
    attributes:
      accountNumber: string(20)! unique | Account number.
      name: string(120)! | Account name.
      accountType: LedgerAccountType! | Statement classification.
      normalBalance: string(6)! | debit or credit.
      isPostable: bool! default=true | Whether journal lines may post to it; summary accounts are not postable.
      isActive: bool! default=true | Whether it can be used.
    refs:
      parent: LedgerAccount back=subAccounts name=ledger_account_is_nested_under_parent | Summary account above it.
      currency: Currency name=ledger_account_is_denominated_in_currency | Currency the account is restricted to; null for any.

  FiscalPeriod:
    description: A monthly accounting period of a fiscal year.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      name: string(20)! unique | Period name, such as FY2026-09.
      fiscalYear: int16! | Fiscal year.
      periodNumber: int16! min=1 max=13 | Period within the year; 13 is the adjustment period.
      period: DateRange! | Dates covered.
      isClosed: bool! default=false | Whether posting is closed.
      closedAt: datetimeoffset | When it was closed.

  JournalEntry:
    description: A balanced set of debits and credits posted to the ledger, from an invoice, a payment, a receipt or a manual adjustment.
    stereotypes: [aggregate-root, audited]
    tags: [financial, high-volume]
    key: sequence
    pluralName: Journal entries
    attributes:
      entryDate: date! indexed | Accounting date.
      reference: string(40) | Source document number.
      description: string(300)! | What the entry records.
      status: JournalEntryStatus! default=Draft | Posting state.
      sourceDocument: string(40) | Kind of source, such as invoice or goods-receipt.
      postedAt: datetimeoffset | When it was posted.
    refs:
      fiscalPeriod: FiscalPeriod! name=journal_entry_falls_in_fiscal_period | Period the entry posts to.
      postedBy: UserAccount name=journal_entry_is_posted_by_user_account | Who posted it.
      reversalOf: JournalEntry name=journal_entry_reverses_reversal_of | Entry this one reverses.
    children:
      lines: JournalLine ordered name=journal_entry_contains_lines | Debit and credit lines.
    overlay:
      description: Journal entry keys come from the named, uncached journal_entry_seq.
      columns:
        id:
          sequence: journal_entry_seq
          comment: Drawn from journal_entry_seq.

  JournalLine:
    description: A debit or credit to one ledger account within a journal entry.
    tags: [financial, high-volume]
    key: identity
    attributes:
      debit: Money | Debit amount; null on credit lines.
      credit: Money | Credit amount; null on debit lines.
      memo: string(200) | Line memo.
    refs:
      ledgerAccount: LedgerAccount! name=journal_line_posts_to_ledger_account | Account posted to.
      costCenter: CostCenter name=journal_line_is_charged_to_cost_center | Cost center charged.

  CostCenter:
    description: A unit that collects costs for management reporting, such as Denver warehouse or Inside sales.
    stereotypes: [audited]
    tags: [financial, master-data]
    attributes:
      code: string(20)! unique | Cost center code.
      name: string(120)! | Cost center name.
      isActive: bool! default=true | Whether it can be charged.
    refs:
      manager: Employee name=cost_center_reports_to_manager | Budget owner.
      parent: CostCenter back=subCostCenters name=cost_center_is_nested_under_parent | Enclosing cost center.

  TaxRate:
    description: A sales tax rate of a jurisdiction for a tax category and period.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      name: string(100)! | Rate name, such as Colorado state sales tax.
      rate: Percentage! | Rate.
      taxCategory: string(30)! | Goods category, such as general or food.
      validity: DateRange! | Period the rate applies.
    refs:
      jurisdiction: TaxJurisdiction! cascade back=rates name=tax_rate_is_levied_by_jurisdiction | Jurisdiction levying the tax.
      salesTaxAccount: LedgerAccount name=tax_rate_posts_tax_to_sales_tax_account | Liability account the tax posts to.

  TaxJurisdiction:
    description: An authority that levies sales tax - a country, state, county or city.
    stereotypes: [audited]
    tags: [financial, master-data]
    attributes:
      code: string(20)! unique | Jurisdiction code.
      name: string(120)! | Name.
      level: string(20)! | country, state, county, city or district.
    refs:
      country: Country! name=tax_jurisdiction_is_located_in_country | Country of the jurisdiction.
      stateProvince: StateProvince name=tax_jurisdiction_is_located_in_state_province | State of the jurisdiction.
      parent: TaxJurisdiction back=subJurisdictions name=tax_jurisdiction_is_nested_under_parent | Enclosing jurisdiction.

  ExchangeRate:
    description: A currency conversion rate on a date, loaded daily from the central bank feed.
    tags: [financial, integration]
    key: identity
    attributes:
      rate: decimal(18,8)! min=0 | Units of the target currency per unit of the source currency.
      effectiveOn: date! indexed | Date the rate applies.
      rateType: string(10)! default=spot | spot, average or budget.
      source: string(40) | Feed the rate came from.
    refs:
      fromCurrency: Currency! name=exchange_rate_converts_from_from_currency | Source currency.
      toCurrency: Currency! name=exchange_rate_converts_to_to_currency | Target currency.

  Budget:
    description: An approved spending budget for a fiscal year and cost center.
    stereotypes: [aggregate-root, audited]
    tags: [financial]
    attributes:
      name: string(120)! | Budget name.
      fiscalYear: int16! | Fiscal year.
      isApproved: bool! default=false | Whether finance approved it.
      notes: text | Assumptions.
    refs:
      costCenter: CostCenter name=budget_is_charged_to_cost_center | Cost center budgeted; null for the company budget.
    children:
      lines: BudgetLine name=budget_contains_lines | Amounts by account and period.

  BudgetLine:
    description: A budgeted amount for one ledger account and period.
    tags: [financial]
    attributes:
      amount: Money! | Budgeted amount.
    refs:
      ledgerAccount: LedgerAccount! name=budget_line_posts_to_ledger_account | Account budgeted.
      fiscalPeriod: FiscalPeriod! name=budget_line_falls_in_fiscal_period | Period budgeted.

diagram:
  name: Finance and ledger
  description: The chart of accounts, journal entries, taxes, rates and budgets.
