package: Fulfillment
displayName: Fulfillment and shipping
description: Getting orders out the door - pick waves and pick lists, shipments and packages, carriers' services and rates, tracking, own-fleet delivery routes and freight claims.

enums:
  FreightTerms:
    description: Incoterms 2020 rule agreed for a shipment, deciding who pays freight and carries the risk.
    members:
      ExWorks: EXW | Buyer collects at the warehouse.
      FreeCarrier: FCA | Seller hands the goods to the buyer's carrier.
      FreeOnBoard: FOB | Seller loads the goods on the vessel.
      CarriagePaidTo: CPT | Seller pays carriage to the named place.
      DeliveredAtPlace: DAP | Seller delivers to the named place, unloaded by the buyer.
      DeliveredDutyPaid: DDP | Seller delivers cleared for import, duties paid.

referenceTypes:
  ShipmentStatus:
    description: Lifecycle of a shipment.
    code: 7
    rows:
      PLAN: Planned | Created from an order, not yet picked.
      PICK: Picking | Being picked.
      PACK: Packed | Packed and labeled.
      SHIP: Shipped | Handed to the carrier or loaded on a route.
      TRANSIT: In transit | Moving, per carrier tracking.
      DLVD: Delivered | Delivered to the customer.
      EXCEPT: Delivery exception | Delayed, damaged or refused.
      CANCEL: Cancelled | Cancelled before shipping.

entities:
  Shipment:
    description: Goods leaving a warehouse for one destination, on a carrier or an own-fleet route.
    stereotypes: [aggregate-root, audited]
    tags: [transactional, integration]
    attributes:
      shipmentNumber: string(20)! unique | Shipment number printed on the packing slip.
      status: ShipmentStatus! default=PLAN | Lifecycle state.
      shipToAddress: Address! | Delivery address.
      freightTerms: FreightTerms | Incoterm of the shipment.
      trackingNumber: string(60) indexed | Master tracking or PRO number.
      estimatedDeliveryOn: date | Carrier's estimate.
      shippedAt: datetimeoffset | When it left the dock.
      deliveredAt: datetimeoffset | When it was delivered.
      freightCost: Money | Freight charged by the carrier.
      declaredValue: Money | Value declared for insurance.
      totalWeight: Weight | Gross weight of all packages.
    refs:
      salesOrder: SalesOrder back=shipments name=shipment_fulfils_sales_order | Order shipped; null for transfers and replacements.
      warehouse: Warehouse! name=shipment_is_kept_at_warehouse | Shipping warehouse.
      carrier: Carrier name=shipment_is_shipped_by_carrier | Carrier; null for own-fleet deliveries.
      carrierService: CarrierService name=shipment_is_shipped_with_carrier_service | Service level booked.
      deliveryRoute: DeliveryRoute name=shipment_rides_on_delivery_route | Own-fleet route.
    children:
      lines: ShipmentLine name=shipment_contains_lines | Order lines shipped.
      packages: ShipmentPackage ordered name=shipment_contains_packages | Cartons and pallets.
    mapping:
      description: Shipment status is a reference type stored through a lookup table; the delivery address columns get a ship_to_ prefix.
      prefix:
        shipToAddress: ship_to_

  ShipmentLine:
    description: The quantity of an order line included in a shipment.
    tags: [high-volume]
    attributes:
      quantity: decimal(12,3)! min=0 | Quantity shipped.
    refs:
      salesOrderLine: SalesOrderLine! name=shipment_line_fulfils_sales_order_line | Order line shipped.
      product: Product! name=shipment_line_is_for_product | Product shipped.
      lot: StockLot name=shipment_line_is_drawn_from_lot | Lot shipped.

  ShipmentPackage:
    description: A carton or pallet of a shipment with its own tracking number.
    attributes:
      packageNumber: int32! min=1 | Package number within the shipment.
      packageType: string(20)! | carton, pallet or envelope.
      trackingNumber: string(60) | Carrier tracking number.
      dimensions: Dimensions | Outer dimensions.
      weight: Weight | Gross weight.
    children:
      contents: PackageContent name=shipment_package_contains_contents | What is inside.

  PackageContent:
    description: A quantity of a shipment line packed in a package.
    attributes:
      quantity: decimal(12,3)! min=0 | Quantity packed.
    refs:
      shipmentLine: ShipmentLine! cascade name=package_content_is_traced_to_shipment_line | Line packed.
      serialNumber: SerialNumber name=package_content_tracks_serial_number | Serialized unit packed.

  PickList:
    description: A list of picks assigned to one picker, generated when a wave is released.
    stereotypes: [aggregate-root, audited]
    tags: [transactional]
    attributes:
      pickListNumber: string(20)! unique | Pick list number.
      status: string(20)! default=open | open, picking, done or short.
      releasedAt: datetimeoffset | When it was released to the floor.
      completedAt: datetimeoffset | When the last pick was confirmed.
    refs:
      warehouse: Warehouse! name=pick_list_is_kept_at_warehouse | Warehouse picked in.
      wave: PickWave back=pickLists name=pick_list_is_picked_in_wave | Wave the list belongs to.
      picker: Employee name=pick_list_is_picked_by_employee | Assigned picker.
    children:
      lines: PickListLine ordered name=pick_list_contains_lines | Picks in walking order.

  PickListLine:
    description: One pick - a product, a bin and a quantity for an order line.
    tags: [high-volume]
    attributes:
      quantityToPick: decimal(12,3)! min=0 | Quantity to pick.
      quantityPicked: decimal(12,3) min=0 | Quantity confirmed.
      pickedAt: datetimeoffset | When it was confirmed.
    refs:
      product: Product! name=pick_list_line_is_for_product | Product to pick.
      bin: BinLocation! name=pick_list_line_is_stored_in_bin | Bin to pick from.
      salesOrderLine: SalesOrderLine! name=pick_list_line_fulfils_sales_order_line | Line the pick is for.
      lot: StockLot name=pick_list_line_is_drawn_from_lot | Lot to pick.

  PickWave:
    description: A batch of orders released to the warehouse floor together, such as the 10:00 parcel wave.
    stereotypes: [audited]
    attributes:
      waveNumber: string(20)! unique | Wave number.
      status: string(20)! default=planned | planned, released or complete.
      plannedStartAt: datetimeoffset | Planned release time.
      releasedAt: datetimeoffset | Actual release time.
    refs:
      warehouse: Warehouse! name=pick_wave_is_kept_at_warehouse | Warehouse of the wave.

  CarrierService:
    description: A service a carrier offers, such as Ground, 2-day air or LTL standard.
    stereotypes: [audited]
    tags: [configuration, integration]
    attributes:
      code: string(20)! | Carrier's service code.
      name: string(100)! | Service name.
      serviceLevel: string(20)! | ground, express, overnight, ltl or ftl.
      transitDays: int16 min=0 | Typical business days in transit.
      isActive: bool! default=true | Whether it can be booked.
    refs:
      carrier: Carrier! cascade back=services name=carrier_service_is_shipped_by_carrier | Carrier offering it.

  FreightRate:
    description: A contracted rate of a carrier service for a zone and weight band.
    stereotypes: [audited]
    tags: [financial]
    attributes:
      weightFromKg: decimal(10,3)! min=0 | Lower bound of the weight band.
      weightToKg: decimal(10,3) min=0 | Upper bound; null for no limit.
      rate: Money! | Rate for the band.
      validity: DateRange! | Contract period.
    refs:
      carrierService: CarrierService! cascade back=rates name=freight_rate_is_shipped_with_carrier_service | Service rated.
      shippingZone: ShippingZone! name=freight_rate_lies_in_shipping_zone | Destination zone.

  TrackingEvent:
    description: A scan event reported by a carrier for a shipment.
    tags: [high-volume, integration]
    key: identity
    attributes:
      occurredAt: datetimeoffset! | When the scan happened.
      eventCode: string(10)! | Carrier event code.
      description: string(200) | Event text.
      city: string(80) | Scan location.
      countryCode: CountryCode | Scan country.
    refs:
      shipment: Shipment! cascade back=trackingEvents name=tracking_event_travels_in_shipment | Shipment tracked.

  DeliveryRoute:
    description: A day's delivery run of an own-fleet truck, visiting stops in order.
    stereotypes: [aggregate-root, audited]
    tags: [transactional]
    attributes:
      routeCode: string(20)! | Route code, such as DEN-NORTH-2.
      routeDate: date! indexed | Delivery date.
      status: string(20)! default=planned | planned, loading, on-road or complete.
      plannedDistanceKm: decimal(8,1) min=0 | Planned distance.
    refs:
      warehouse: Warehouse! name=delivery_route_departs_from_warehouse | Depot.
      vehicle: Vehicle name=delivery_route_is_driven_in_vehicle | Truck.
      driver: Driver name=delivery_route_is_driven_by_driver | Driver.
    children:
      stops: RouteStop ordered name=delivery_route_contains_stops | Stops in driving order.

  RouteStop:
    description: A stop on a delivery route.
    attributes:
      stopNumber: int16! min=1 | Position on the route.
      address: Address! | Stop address.
      location: GeoCoordinate | Geocoded position.
      plannedArrivalAt: datetimeoffset | Planned arrival.
      actualArrivalAt: datetimeoffset | Actual arrival.
    refs:
      shipment: Shipment name=route_stop_travels_in_shipment | Shipment delivered at the stop.

  Vehicle:
    description: A truck or van of the own delivery fleet.
    stereotypes: [audited]
    attributes:
      registrationNumber: string(20)! unique | License plate.
      vehicleType: string(20)! | box-truck, van or tractor.
      capacityWeight: Weight | Payload capacity.
      capacityVolumeM3: decimal(8,2) min=0 | Cargo volume.
      isRefrigerated: bool! default=false | Whether it can carry chilled goods.
      isActive: bool! default=true | Whether it is in service.
    refs:
      homeWarehouse: Warehouse name=vehicle_is_based_at_home_warehouse | Depot the vehicle is based at.

  Driver:
    description: An employee licensed to drive the own fleet.
    stereotypes: [audited]
    tags: [pii]
    attributes:
      licenseNumber: string(30)! unique pii | Driving license number.
      licenseClass: string(10) | License class, such as CDL-B.
      licenseExpiresOn: date! | License expiry.
      mobilePhone: PhoneNumber pii | Phone carried on routes.
    refs:
      employee: Employee! one back=driverProfile name=driver_involves_employee | Employee who drives.

  ProofOfDelivery:
    description: Evidence that a shipment was delivered - who signed, where and when.
    tags: [pii]
    pluralName: Proofs of delivery
    attributes:
      deliveredAt: datetimeoffset! | Delivery time.
      receivedByName: string(120) pii | Name of the person who signed.
      signatureImageUrl: string(400) | Signature capture.
      photoUrl: string(400) | Photo of the delivered goods.
      location: GeoCoordinate | Where it was captured.
      notes: string(500) | Driver's remarks.
    refs:
      shipment: Shipment! cascade one back=proofOfDelivery name=proof_of_delivery_travels_in_shipment | Shipment delivered.

  ShippingLabel:
    description: A carrier label generated for a package.
    attributes:
      format: string(10)! | ZPL or PDF.
      storageKey: string(400)! | Object storage key of the label file.
      generatedAt: datetimeoffset! | When the label was generated.
    refs:
      shipmentPackage: ShipmentPackage! cascade one back=label name=shipping_label_is_packed_in_shipment_package | Labeled package.

  FreightClaim:
    description: A claim against a carrier for lost, damaged or delayed freight.
    stereotypes: [aggregate-root, audited]
    tags: [financial]
    attributes:
      claimNumber: string(20)! unique | Claim number.
      filedOn: date! | Filing date.
      claimType: string(20)! | loss, damage or delay.
      claimedAmount: Money! | Amount claimed.
      settledAmount: Money | Amount the carrier paid.
      status: string(20)! default=filed | filed, under-review, settled or denied.
      notes: text | Claim narrative.
    refs:
      shipment: Shipment! name=freight_claim_travels_in_shipment | Shipment concerned.
      carrier: Carrier! name=freight_claim_is_shipped_by_carrier | Carrier claimed against.

  ShippingZone:
    description: A destination zone used to rate freight, such as zone 5 from Denver.
    tags: [configuration]
    attributes:
      code: string(20)! unique | Zone code.
      name: string(100)! | Zone name.
      description: string(300) | Postal code ranges in the zone.
    refs:
      country: Country name=shipping_zone_is_located_in_country | Country of the zone.
      originWarehouse: Warehouse name=shipping_zone_originates_at_origin_warehouse | Warehouse the zone is measured from.

diagram:
  name: Fulfillment and shipping
  description: Picking, packing, shipping and delivery.
  columns: 5
